<!doctype html>
<html lang="en" data-scheme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0f12">
<meta name="description" content="STILL — a calm, local-first personal workspace.">
<title>STILL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171b'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%234d9078' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%234d9078'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   STILL — stylesheet
   1. Design tokens   2. Base   3. Primitives (buttons, inputs, …)
   4. Shell (top bar, navigation)   5. Pages   6. Home panels
   7. Overlays (dialogs, popovers, toasts, drop zone)   8. Settings
   9. Responsive   10. Motion
   Colours, radii, blur and fonts are theme tokens: the theme engine in
   the <head> script rewrites them on :root, so every component follows.
   ===================================================================== */

/* ---------- 1. Design tokens ---------- */
:root {
  /* Theme (defaults = Graphite; overwritten at runtime by StillTheme) */
  --bg: #0e0f12;
  --bg-deep: #0b0b0e;
  --surface: rgba(30, 32, 38, 0.58);
  --surface-raised: rgba(30, 32, 38, 0.92);
  --surface-sunken: rgba(0, 0, 0, 0.22);
  --hover: rgba(255, 255, 255, 0.05);
  --hover-strong: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text: #ececef;
  --text-2: #a2a5ad;
  --text-3: #6c7079;
  --accent: #4d9078;
  --on-accent: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 60%, transparent);
  --danger: #ef7a7a;
  --backdrop: rgba(6, 7, 9, 0.55);
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.035) inset, 0 24px 48px -24px rgba(0, 0, 0, 0.65);
  --shadow-pop: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 30px 80px -20px rgba(0, 0, 0, 0.75);
  --blur: 22px;

  /* Typography */
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: var(--font);
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-md: 16px;
  --fs-lg: 20px;
  --fs-xl: 26px;
  --fs-display: 46px;

  /* Spacing (4px scale) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --gutter: var(--s8);
  --pad: var(--s5);       /* panel padding */
  --gap: var(--s5);       /* space between panels */
  --row: 42px;            /* task row height */
  --cal-day: clamp(28px, 4.2vh, 36px);

  /* Shape */
  --r-panel: 16px;
  --r-ctl: 9px;
  --r-sm: 6px;
  --ctl-h: 34px;
  --ctl-h-sm: 28px;
  --icon: 18px;
  --icon-sm: 16px;
  --topbar-h: 56px;

  /* Motion: slow-fast-slow */
  --ease: cubic-bezier(0.45, 0, 0.2, 1);
  --t-fast: 120ms;
  --t: 200ms;
  --t-slow: 320ms;
  --t-theme: 360ms;
}
:root[data-density="compact"] {
  --pad: var(--s4);
  --gap: var(--s3);
  --row: 36px;
  --ctl-h: 30px;
  --ctl-h-sm: 26px;
  --cal-day: clamp(26px, 3.7vh, 32px);
  --gutter: var(--s5);
}

/* ---------- 2. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); color-scheme: dark; height: 100%; overflow: hidden; overscroll-behavior: none; }
html[data-scheme="light"] { color-scheme: light; }
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation; /* no double-tap zoom */
  background: var(--bg);
  color: var(--text);
  font: 400 var(--fs-base)/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss03";
  transition: background-color var(--t-theme) var(--ease), color var(--t-theme) var(--ease);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
kbd {
  font: 500 var(--fs-xs)/1 var(--font);
  min-width: 20px; height: 20px; padding: 0 5px;
  display: inline-grid; place-items: center;
  border-radius: 5px; border: 1px solid var(--border-strong);
  background: var(--surface-sunken); color: var(--text-2);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.icon {
  width: var(--icon); height: var(--icon); flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.icon--sm { width: var(--icon-sm); height: var(--icon-sm); }

/* Ambient light behind the glass */
.ambient {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vmax 45vmax at 8% -12%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 62%),
    radial-gradient(55vmax 40vmax at 104% 112%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    linear-gradient(180deg, var(--bg), var(--bg-deep));
}

/* Glass surface, shared by panels, the top bar, dialogs and popovers */
.glass {
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  transition: background-color var(--t-theme) var(--ease), border-color var(--t-theme) var(--ease), border-radius var(--t-theme) var(--ease);
}

/* ---------- 3. Primitives ---------- */
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  height: var(--ctl-h); padding: 0 var(--s4);
  border-radius: var(--r-ctl);
  border: 1px solid var(--border-strong);
  background: var(--hover);
  color: var(--text);
  font-size: var(--fs-sm); font-weight: 500; white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:hover { background: var(--hover-strong); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn--primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--hover); color: var(--text); }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: transparent; }
.btn--danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn--sm { height: var(--ctl-h-sm); padding: 0 var(--s3); }
.btn--square { width: var(--ctl-h); padding: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

.icon-btn {
  position: relative;
  width: var(--ctl-h); height: var(--ctl-h);
  display: inline-grid; place-items: center; flex: none;
  border-radius: var(--r-ctl);
  color: var(--text-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
}
.icon-btn:hover { background: var(--hover-strong); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn--sm { width: var(--ctl-h-sm); height: var(--ctl-h-sm); border-radius: var(--r-sm); }
.icon-btn--sm .icon { width: var(--icon-sm); height: var(--icon-sm); }

.link-btn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-3); border-radius: var(--r-sm); transition: color var(--t-fast) var(--ease); }
.link-btn:hover { color: var(--text); }
.link-btn .icon { width: 14px; height: 14px; }

/* Inputs */
.input {
  width: 100%; height: var(--ctl-h);
  padding: 0 var(--s3);
  border-radius: var(--r-ctl);
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  color: var(--text);
  font-size: var(--fs-base);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.input::placeholder { color: var(--text-3); }
.input:hover { border-color: var(--border-strong); }
.input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
textarea.input { height: auto; min-height: 104px; padding: var(--s3); line-height: 1.5; resize: vertical; }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
.input--inline { height: 30px; padding: 0 var(--s2); }

.search { position: relative; flex: 1; min-width: 0; display: block; }
.search > .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .input { padding-left: 34px; padding-right: 34px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; transition: opacity var(--t-fast); }
.search .input:focus ~ kbd, .search .input:not(:placeholder-shown) ~ kbd { opacity: 0; }

/* Checkbox (round, used for tasks) */
.check {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 18px; height: 18px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--text-3);
  display: inline-grid; place-items: center;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.check:hover { border-color: var(--text-2); }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check::after {
  content: ""; width: 8px; height: 4.5px;
  border: solid var(--on-accent); border-width: 0 0 1.75px 1.75px;
  transform: translate(0, -1px) rotate(-45deg) scale(0);
  transition: transform var(--t) var(--ease);
}
.check:checked::after { transform: translate(0, -1px) rotate(-45deg) scale(1); }
.check-hit { display: grid; place-items: center; width: 30px; height: 30px; flex: none; cursor: pointer; }

/* Switch */
.switch { display: inline-flex; align-items: center; gap: var(--s3); cursor: pointer; font-size: var(--fs-sm); color: var(--text-2); }
.switch input {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 34px; height: 20px; border-radius: 999px; flex: none;
  background: var(--hover-strong); border: 1px solid var(--border-strong);
  position: relative; cursor: pointer;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
}
.switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: var(--text-2);
  transition: transform var(--t) var(--ease), background var(--t) var(--ease);
}
.switch input:checked { background: var(--accent); border-color: transparent; }
.switch input:checked::after { transform: translateX(14px); background: var(--on-accent); }
.switch input:disabled { opacity: 0.45; cursor: not-allowed; }

/* Segmented control */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-ctl); background: var(--surface-sunken); border: 1px solid var(--border); flex: none; }
.seg button {
  height: calc(var(--ctl-h) - 8px); padding: 0 var(--s3); border-radius: calc(var(--r-ctl) - 3px);
  font-size: var(--fs-sm); font-weight: 500; color: var(--text-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--hover-strong); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip {
  height: 26px; padding: 0 var(--s3); border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-2);
  font-size: var(--fs-sm); font-weight: 500;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.chip:hover { background: var(--hover); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2);
  border-radius: 999px; background: var(--hover); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap;
}

/* Colour swatches (accent picker, task colours) */
.swatches { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.swatch {
  position: relative; flex: none;
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c); color: var(--on-c, #fff);
  box-shadow: 0 0 0 1px var(--border-strong) inset;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.swatch:hover { transform: scale(1.1); }
.swatch .icon { width: 14px; height: 14px; stroke-width: 2.4; opacity: 0; transform: scale(0.6); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--border-strong) inset, 0 0 0 2px var(--surface-raised), 0 0 0 3.5px var(--text-2); }
.swatch[aria-pressed="true"] .icon { opacity: 1; transform: none; }
.swatch--none { background: transparent; color: var(--text-3); }
.swatch--none .icon { opacity: 1; transform: none; width: 16px; height: 16px; stroke-width: 1.6; }
.swatch--custom { overflow: hidden; cursor: pointer; background: conic-gradient(#ef7a7a, #e6c26b, #7fd1a4, #6fb7f0, #a78bfa, #ef7a7a); }
.swatch--custom[aria-pressed="true"] { background: radial-gradient(circle, var(--c) 0 6px, transparent 6.5px), conic-gradient(#ef7a7a, #e6c26b, #7fd1a4, #6fb7f0, #a78bfa, #ef7a7a); }
.swatch--custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }

/* Forms */
.form { display: flex; flex-direction: column; gap: var(--s4); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field__label { font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.field-row { display: flex; gap: var(--s3); }
.field-row > * { flex: 1 1 0; min-width: 0; }
.form-error { font-size: var(--fs-sm); color: var(--danger); min-height: 1em; }

/* Tooltips */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; left: 50%; top: calc(100% + 8px); z-index: 40;
  transform: translate(-50%, -3px);
  padding: 5px 8px; border-radius: var(--r-sm);
  background: var(--surface-raised); border: 1px solid var(--border-strong);
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
  color: var(--text); font: 500 var(--fs-xs)/1.2 var(--font); white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
[data-tip-align="end"]::after { left: auto; right: 0; transform: translate(0, -3px); }
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 400ms; }
[data-tip-align="end"]:hover::after, [data-tip-align="end"]:focus-visible::after { transform: translate(0, 0); }
@media (hover: none) { [data-tip]::after { display: none; } }

/* Empty states */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s6) var(--s4); text-align: center; color: var(--text-3); font-size: var(--fs-sm); }
.empty .icon { color: var(--text-3); opacity: 0.7; }

/* ---------- 4. Shell ---------- */
/* The page is a fixed frame the size of the window. */
.app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

/* The glass lives on ::before so the bar never becomes a containing block
   for the fixed-position mobile navigation inside it. */
.topbar {
  position: sticky; top: var(--s3); z-index: 20; isolation: isolate;
  display: flex; align-items: center; gap: var(--s4);
  height: var(--topbar-h);
  margin: var(--s3) var(--gutter) 0;
  padding: 0 var(--s3) 0 var(--s4);
  border-radius: var(--r-panel);
}
.topbar::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  transition: background-color var(--t-theme) var(--ease), border-color var(--t-theme) var(--ease);
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: var(--s2); font-size: 13px; font-weight: 600; letter-spacing: 0.32em; color: var(--text); user-select: none; }
.brand__mark { width: 18px; height: 18px; color: var(--accent); }
.divider { width: 1px; height: 20px; background: var(--border-strong); flex: none; }

.nav { display: flex; align-items: center; gap: var(--s1); }
.nav__btn[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
.nav__btn[aria-current="page"] .icon { color: var(--accent); }
.nav__label { display: none; }

.actions { margin-left: auto; display: flex; align-items: center; gap: var(--s1); }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1680px; margin: 0 auto; padding: var(--s8) var(--gutter); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ---------- 5. Pages ---------- */
.page { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: page-in var(--t-slow) var(--ease); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s6); }
.page-head__title { font: 600 var(--fs-xl)/1.2 var(--font-head); letter-spacing: -0.015em; }
.page-head__sub { margin-top: 6px; color: var(--text-2); font-size: var(--fs-base); text-wrap: pretty; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); flex: none; }
.subhead { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: var(--s2); }
.count { font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }

/* Placeholder workspaces */
.workspace { flex: 1; display: grid; place-items: center; padding: var(--s10) var(--s6); border-radius: var(--r-panel); min-height: 360px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 380px; gap: var(--s3); }
.empty-state__icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent); margin-bottom: var(--s2); }
.empty-state__icon .icon { width: 24px; height: 24px; }
.empty-state__title { font: 600 var(--fs-md)/1.3 var(--font-head); }
.empty-state__text { color: var(--text-2); font-size: var(--fs-base); }
.empty-state .btn { margin-top: var(--s3); }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }

/* Inbox (Notes page) */
.inbox { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }
.card { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); border-radius: var(--r-panel); min-height: 132px; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
.card__title { font: 600 var(--fs-base)/1.35 var(--font-head); overflow-wrap: anywhere; }
.card__text { color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.card__foot { margin-top: auto; padding-top: var(--s2); display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-xs); color: var(--text-3); }
.card .icon-btn { margin: -4px -6px 0 0; opacity: 0; }
.card .icon-btn:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.card:hover .icon-btn, .card:focus-within .icon-btn { opacity: 1; }
@media (hover: none) { .card .icon-btn { opacity: 1; } }

/* ---------- 6. Home panels ---------- */
.dashboard { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: var(--gap); min-height: 600px; }
.panel { display: flex; flex-direction: column; min-height: 0; padding: var(--pad); border-radius: var(--r-panel); }
.panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); height: var(--ctl-h-sm); margin-bottom: var(--s4); flex: none; }
.panel__title { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.panel__section { display: flex; flex-direction: column; flex: 1; min-height: 0; margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--border); }
.list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 calc(var(--s2) * -1); padding: 0 var(--s2); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* Clock */
.clock { flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--s4); }
.stack { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }
.panel--clock { flex: none; container-type: inline-size; }
.panel--notes { flex: 1; min-height: 160px; }
.panel__actions { display: flex; align-items: center; gap: var(--s2); }
/* The face is sized by the window height, capped by the card's width (cqi). */
.clock__face { height: min(max(150px, 31vh), 270px, 100cqi); aspect-ratio: 1; max-width: 100%; }
.clock.no-time .clock__face { height: min(max(180px, 41vh), 340px, 100cqi); }
.clock.no-time .clock__digital { display: none; }
.clock__face svg { width: 100%; height: 100%; display: block; overflow: visible; }
.clock[data-face="digital"] { padding: var(--s6) 0 var(--s2); }
.clock[data-face="digital"] .clock__face { display: none; }
.clock[data-face="digital"] .clock__digital { font-size: calc(var(--fs-display) * 1.45); }
.clock__readout { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.clock__digital { display: flex; align-items: flex-end; gap: var(--s2); font: 300 var(--fs-display)/1 var(--font-head); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
/* Zone stacked over AM/PM, bottom-aligned with the digits' baseline. */
.clock__side { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding-bottom: 0.1em; letter-spacing: normal; }
.clock__zone { font: 600 var(--fs-xs)/1 var(--font); letter-spacing: 0.08em; color: var(--text-3); }
.clock__ampm { font: 500 var(--fs-md)/1 var(--font); letter-spacing: 0.04em; color: var(--text-2); }
.clock__ampm:empty { display: none; }
.clock__date { font-size: var(--fs-sm); color: var(--text-2); margin-top: var(--s1); }
.clock__location { font-size: var(--fs-sm); color: var(--text-3); margin-top: 2px; }
/* Clock face artwork (drawn by ClockFace) */
.clock__rim { fill: var(--surface-sunken); stroke: var(--border-strong); }
.clock__tick { stroke: var(--text-3); stroke-linecap: round; }
.clock__tick--hour { stroke: var(--text-2); }
.clock__marker { stroke: var(--text); stroke-linecap: round; }
.clock__num { fill: var(--text); font-family: var(--font-head); font-weight: 500; }
.clock__hand line { stroke: var(--text); stroke-linecap: round; }
.clock__hand--quiet line { stroke: var(--text-2); }
.clock__hand--accent line { stroke: var(--accent); }
.clock__hand--accent circle { fill: var(--accent); }
.clock__pin { fill: var(--text); }
.clock__pin--accent { fill: var(--accent); }
.clock__pin-core { fill: var(--bg); }
.clock__digits { fill: var(--text); font-family: var(--font-head); font-weight: 300; }

/* Quick notes */
.notes__area {
  overscroll-behavior: contain;
  flex: 1; width: 100%; min-height: 72px; margin: 0; padding: 0;
  border: 0; outline: none; resize: none; background: transparent;
  color: var(--text); font: 400 var(--fs-base)/1.6 var(--font);
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
.notes__area::placeholder { color: var(--text-3); }
.btn--sm .icon { width: 14px; height: 14px; }
.notes__status { font-size: var(--fs-xs); color: var(--text-3); opacity: 0; transition: opacity var(--t) var(--ease); }
.notes__status.is-visible { opacity: 1; }

/* Calendar */
.cal__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s3); flex: none; }
.cal__nav { display: flex; align-items: center; gap: 2px; }
.cal__month { font: 600 var(--fs-lg)/1.3 var(--font-head); letter-spacing: -0.01em; }
.panel--calendar .btn.is-away { color: var(--accent); }
.cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; flex: none; }
.cal__dow { height: 24px; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); }
.cal__day {
  position: relative; height: var(--cal-day); border-radius: var(--r-sm);
  display: grid; place-items: center;
  font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--text);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.cal__day:hover { background: var(--hover-strong); }
.cal__day.is-outside { color: var(--text-3); }
.cal__day.is-today { color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal--weekends .cal__day.is-weekend:not([aria-pressed="true"]) { background: var(--hover); }
.cal--weekends .cal__day.is-weekend:not([aria-pressed="true"]):hover { background: var(--hover-strong); }
.cal--weekends .cal__dow.is-weekend { color: var(--text-2); }
.cal__day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
/* Selected and today: the fill plus an inner ring in the contrasting ink. */
.cal__day.is-today[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 3.5px var(--on-accent); }
.cal__dots { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.cal__dot { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
.cal__day.is-outside .cal__dot { background: var(--text-3); }
.cal__day[aria-pressed="true"] .cal__dot { background: var(--on-accent); }

.event { display: flex; align-items: stretch; gap: var(--s3); width: 100%; padding: var(--s2); border-radius: var(--r-sm); text-align: left; transition: background var(--t-fast) var(--ease); }
.event:hover { background: var(--hover); }
.event__bar { width: 3px; border-radius: 2px; background: var(--accent); flex: none; }
.event__body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.event__title { font-weight: 500; overflow-wrap: anywhere; }
.event__time { font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Tasks */
.tasks__tools { display: flex; gap: var(--s2); flex: none; }
.week { display: flex; align-items: center; gap: 2px; margin: var(--s4) calc(var(--s2) * -1) 0; flex: none; }
.week__days { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; border-radius: var(--r-ctl); transition: background var(--t-fast) var(--ease); }
.wday:hover { background: var(--hover); }
.wday[aria-pressed="true"] { background: var(--hover-strong); }
.ring { position: relative; width: min(34px, 100%); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring__track { fill: none; stroke: var(--hover-strong); stroke-width: 2.5; }
.ring__fill { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dasharray var(--t-slow) var(--ease), opacity var(--t) var(--ease); }
.ring__label { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.wday[aria-pressed="true"] .ring__label { color: var(--text); }
.wday.is-complete .ring__label { color: var(--accent); }
.wday__num { font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.wday.is-today .wday__num { color: var(--accent); font-weight: 600; }

.tasks__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); flex: none; }
.task-list { display: flex; flex-direction: column; gap: 6px; position: relative; }
.task, .composer {
  position: relative; flex: none;
  display: flex; align-items: center; gap: 2px;
  min-height: var(--row); padding: 3px var(--s1) 3px 2px;
  border-radius: var(--r-ctl);
  border: 1px solid var(--border);
  background: var(--hover);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.task:hover { border-color: var(--border-strong); }
.task.has-color { border-color: color-mix(in srgb, var(--task-c) 55%, var(--border)); background: color-mix(in srgb, var(--task-c) 15%, transparent); }
.task.has-color::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--task-c); }
.task.is-dragging { z-index: 3; transition: none; box-shadow: var(--shadow-pop); border-color: var(--border-strong); background: var(--surface-raised); }
.task.is-dragging.has-color { background: color-mix(in srgb, var(--task-c) 18%, var(--surface-raised)); }
.task__handle { width: 16px; height: 30px; flex: none; display: grid; place-items: center; color: var(--text-3); cursor: grab; touch-action: none; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.task__handle .icon { width: 14px; height: 14px; }
.task:hover .task__handle, .task.is-dragging .task__handle, .task__handle:focus-visible { opacity: 1; }
.task.is-dragging .task__handle { cursor: grabbing; }
.task__text {
  flex: 1; min-width: 0; padding: 6px var(--s2); border-radius: var(--r-sm);
  text-align: left; cursor: text; overflow-wrap: anywhere;
  transition: color var(--t) var(--ease);
}
.task.is-done .task__text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
.task.is-done .check-hit { opacity: 0.8; }
.task .input--inline { flex: 1; margin-right: var(--s1); }
.task__date { flex: none; margin-right: var(--s1); }
.task__more { opacity: 0.35; }
.task:hover .task__more, .task:focus-within .task__more, .task__more[aria-expanded="true"] { opacity: 1; }
.task-list.is-searching .task__handle { display: none; }
html.is-dragging, html.is-dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing; }
@media (hover: none) { .task__handle { opacity: 0.55; } .task__more { opacity: 0.8; } }
.composer { border-style: dashed; padding-left: var(--s1); background: transparent; }
.composer .check { border-style: dashed; cursor: default; }
.composer .input--inline { flex: 1; }

/* ---------- 7. Overlays ---------- */
.dialog {
  padding: 0; margin: auto;
  width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  border-radius: var(--r-panel); border: 1px solid var(--border-strong);
  background: var(--surface-raised); color: var(--text);
  box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  backdrop-filter: blur(28px) saturate(140%);
  overflow: hidden;
  transition: background-color var(--t-theme) var(--ease), border-color var(--t-theme) var(--ease), color var(--t-theme) var(--ease);
}
.dialog[open] { display: flex; flex-direction: column; animation: dialog-in var(--t-slow) var(--ease); }
.dialog::backdrop { background: var(--backdrop); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade-in var(--t-slow) var(--ease); }
.dialog.is-closing { animation: dialog-out 140ms var(--ease) forwards; }
.dialog.is-closing::backdrop { animation: fade-out 140ms var(--ease) forwards; }
.dialog--wide { width: min(520px, calc(100vw - 32px)); }
.dialog--top { margin-top: min(14vh, 120px); }
.dialog__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s4) 0 var(--s5); flex: none; }
.dialog__title { font: 600 var(--fs-md)/1.3 var(--font-head); }
.dialog__sub { padding: var(--s3) var(--s5) var(--s3); border-bottom: 1px solid var(--border); flex: none; }
.dialog__body { padding: var(--s4) var(--s5); overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; color: var(--text-2); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.dialog__foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s5) var(--s5); border-top: 1px solid var(--border); flex: none; }
.dialog__foot .spacer { flex: 1; }
.dialog__hint { font-size: var(--fs-xs); color: var(--text-3); display: flex; align-items: center; gap: 4px; }
.confirm__detail { margin-top: var(--s3); font-size: var(--fs-sm); color: var(--text-3); }

/* Popover menus */
.popover {
  position: fixed; z-index: 70;
  min-width: 228px; max-width: calc(100vw - 16px);
  padding: 6px;
  border-radius: calc(var(--r-ctl) + 3px);
  background: var(--surface-raised); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  color: var(--text);
  animation: pop-in var(--t) var(--ease);
}
.popover.is-closing { animation: pop-out 120ms var(--ease) forwards; }
.menu__item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; height: 32px; padding: 0 10px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); text-align: left; color: var(--text);
  transition: background var(--t-fast) var(--ease);
}
.menu__item:hover, .menu__item:focus-visible { background: var(--hover-strong); outline: none; }
.menu__item:disabled { opacity: 0.4; pointer-events: none; }
.menu__item .icon { width: 16px; height: 16px; color: var(--text-2); }
.menu__item--danger, .menu__item--danger .icon { color: var(--danger); }
.menu__item--danger:hover, .menu__item--danger:focus-visible { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.menu__sep { height: 1px; background: var(--border); margin: 6px 4px; }
.menu__group { padding: 8px 10px 10px; }
.menu__label { margin-bottom: 10px; }

.toasts {
  position: fixed; inset: auto auto var(--s6) 50%; transform: translateX(-50%);
  margin: 0; padding: 0; border: 0; background: none; overflow: visible;
  display: flex; flex-direction: column-reverse; align-items: center; gap: var(--s2);
  z-index: 100; pointer-events: none; width: max-content; max-width: calc(100vw - 32px);
}
.toast {
  display: flex; align-items: center; gap: var(--s3);
  padding: 9px var(--s2) 9px var(--s4); min-height: 40px;
  border-radius: var(--r-ctl);
  background: var(--surface-raised); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
  font: 400 var(--fs-sm)/1.4 var(--font); color: var(--text);
  pointer-events: auto;
  animation: toast-in var(--t-slow) var(--ease);
}
.toast.is-leaving { animation: toast-out var(--t) var(--ease) forwards; }
.toast__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.toast--error .toast__dot { background: var(--danger); }
.toast__msg { padding-right: var(--s2); }
.toast .btn { height: 26px; padding: 0 var(--s2); color: var(--accent); }

.dropzone {
  position: fixed; inset: var(--s3); z-index: 90;
  display: grid; place-items: center;
  border-radius: var(--r-panel); border: 1.5px dashed var(--accent-line);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  pointer-events: none;
  animation: fade-in var(--t) var(--ease);
}
.dropzone__inner { display: flex; flex-direction: column; align-items: center; gap: var(--s2); text-align: center; }
.dropzone__inner .icon { width: 28px; height: 28px; color: var(--accent); }
.dropzone__title { font-size: var(--fs-md); font-weight: 600; }
.dropzone__text { color: var(--text-2); font-size: var(--fs-sm); }

/* ---------- 8. Settings ---------- */
.dialog--settings { width: min(600px, calc(100vw - 32px)); height: min(760px, calc(100dvh - 32px)); max-height: none; }
.dialog--settings .dialog__body { padding: var(--s2) var(--s4) var(--s5); }
.settings-empty { padding: var(--s10) var(--s4); text-align: center; color: var(--text-3); font-size: var(--fs-sm); }

.acc { border-bottom: 1px solid var(--border); }
.acc:last-of-type { border-bottom: 0; }
.acc__head {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; padding: var(--s3) var(--s1); min-height: 64px;
  text-align: left; border-radius: var(--r-ctl);
  transition: background var(--t-fast) var(--ease);
}
.acc__head:hover { background: var(--hover); }
.acc__icon { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: var(--r-ctl); background: var(--hover); color: var(--text-2); transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.acc.is-open .acc__icon { background: var(--accent-soft); color: var(--accent); }
.acc__text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.acc__title { font-size: var(--fs-base); font-weight: 600; color: var(--text); }
.acc__desc { font-size: var(--fs-sm); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc__chev { color: var(--text-3); transition: transform var(--t-slow) var(--ease); }
.acc.is-open .acc__chev { transform: rotate(180deg); }
.acc__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-slow) var(--ease); }
.acc.is-open .acc__panel { grid-template-rows: 1fr; }
.acc__inner { min-height: 0; overflow: hidden; }
.acc__content { display: flex; flex-direction: column; padding: 0 var(--s1) var(--s4) 54px; }
.acc__foot { display: flex; justify-content: flex-end; padding-top: var(--s3); }

.srow { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: 52px; padding: var(--s2) 0; border-top: 1px solid var(--border); color: var(--text); font-size: var(--fs-base); }
.srow:first-child { border-top: 0; }
.srow--stack { flex-direction: column; align-items: stretch; gap: var(--s3); padding: var(--s3) 0; }
.srow__label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.srow__hint { font-size: var(--fs-xs); color: var(--text-3); }
.srow .input { max-width: 240px; }
.srow .swatches { justify-content: flex-end; }
.srow p { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.5; }
.srow kbd + kbd { margin-left: 4px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
.tiles--themes { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px 8px;
  border-radius: var(--r-ctl); border: 1px solid var(--border);
  background: var(--surface-sunken);
  font-size: var(--fs-xs); font-weight: 500; color: var(--text-2);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.tile:hover { border-color: var(--border-strong); color: var(--text); }
.tile[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
.tile__svg { width: 44px; height: 44px; display: block; overflow: visible; }
.tile__font { height: 44px; display: grid; place-items: center; font-size: 24px; color: var(--text); line-height: 1; }
.theme-prev { position: relative; width: 100%; height: 40px; border-radius: calc(var(--r-ctl) - 3px); background: var(--pv-bg); border: 1px solid var(--border); overflow: hidden; }
.theme-prev::before { content: ""; position: absolute; left: 8px; top: 9px; right: 16px; bottom: -6px; border-radius: 5px; background: var(--pv-panel); border: 1px solid var(--pv-line); }
.theme-prev::after { content: ""; position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--pv-accent); }
.theme-prev--custom { background: conic-gradient(from 200deg, #223843, #750d37, #d77a61, #d7c62c, #4d9078, #223843); }
.theme-prev--custom::before, .theme-prev--custom::after { display: none; }

.range-wrap { display: flex; align-items: center; gap: var(--s3); flex: none; }
.range { -webkit-appearance: none; appearance: none; width: 168px; height: 20px; margin: 0; background: transparent; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--hover-strong) var(--p, 50%)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--text); border: 0; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); }
.range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--hover-strong); }
.range::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent); }
.range::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); }
.range__value { width: 40px; text-align: right; font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; }

.color-field {
  position: relative; display: inline-flex; align-items: center; gap: var(--s2);
  height: var(--ctl-h); padding: 0 var(--s3) 0 6px; flex: none;

    { name: 'Mist', hex: '#eff1f3' },
    { name: 'Wine', hex: '#750d37' },
    { name: 'Sage', hex: '#4d9078' },
    { name: 'Mustard', hex: '#d7c62c' },

    mocha: { label: 'Mocha', bg: '#13100d', panel: '#2a211b', line: '#ffe8d4', text: '#f0e7df', accent: '#d77a61' },

<script>
'use strict';
/* =====================================================================

   Architecture (one file today, modules tomorrow):
     Utilities → Dates → Model (schema, normalisation) → Store (single

     UI services (icons, dialogs, popovers, toasts, theme) → Features

     Drag & drop → Render loop → Init.

/* ---------- Dates ----------

   "HH:MM" wall-clock strings. Events are therefore "floating": 9:00 stays

const pad2 = (n) => String(n).padStart(2, '0');

  parse(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d, 12); },
  today() { return Dates.key(new Date()); },
  isKey(k) { return typeof k === 'string' && KEY_RE.test(k) && Dates.key(Dates.parse(k)) === k; },
  isMonth(m) { return typeof m === 'string' && MONTH_RE.test(m) && +m.slice(5) >= 1 && +m.slice(5) <= 12; },
  isTime(t) { return typeof t === 'string' && TIME_RE.test(t); },

  month(key) { return key.slice(0, 7); },

  range(from, to) { const out = []; for (let k = from; k <= to; k = Dates.addDays(k, 1)) out.push(k); return out; },

/** Locale-aware formatting; formatters are created once. */
const Fmt = (() => {
  const f = (opts) => new Intl.DateTimeFormat(undefined, opts);
  const weekdayShort = f({ weekday: 'short' });
  const weekdayNarrow = f({ weekday: 'narrow' });

  const shortDay = f({ weekday: 'short', day: 'numeric', month: 'short' });
  const monthYear = f({ month: 'long', year: 'numeric' });

    shortDay: (k) => shortDay.format(Dates.parse(k)),

})();

/* ---------- Model ----------
   Every piece of content is an Item in one collection:
     { id, type, createdAt, updatedAt, title, content, meta, links }
   `type` says what it is (task, event, capture, note, file, connection,
   pin); `meta` holds type-specific fields; `links` holds ids of related
   items so anything can reference anything. One shape means one search,
   one backup format and one place to add relationships later. */
const SCHEMA_VERSION = 1;
const PAGE_IDS = ['home', 'notes', 'files', 'connections', 'pins'];
const CLOCK_FACES = ['minimal', 'classic', 'modern', 'digital'];
const CLOCK_SHAPES = ['circle', 'rounded', 'squircle', 'hexagon'];
const THEME_IDS = [...Object.keys(THEMES), 'custom'];
const FONT_IDS = Object.keys(FONTS);
const SETTINGS_SECTIONS = ['clock', 'calendar', 'appearance', 'shortcuts', 'data'];

function detect24h() {
  try { const hc = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hourCycle; return hc === 'h23' || hc === 'h24'; }
  catch { return false; }
}
const DEFAULT_CUSTOM_THEME = Object.freeze({ bg: THEMES.graphite.bg, panel: THEMES.graphite.panel, line: THEMES.graphite.line, text: THEMES.graphite.text });
const DEFAULT_SETTINGS = Object.freeze({
  // Clock
  clock24: detect24h(), location: '', clockFace: 'minimal', clockShape: 'circle', showTime: true, showSeconds: true, showDate: false,
  // Calendar
  weekStart: 1, highlightWeekends: false,
  // Appearance
  theme: 'graphite', customTheme: DEFAULT_CUSTOM_THEME, accent: THEMES.graphite.accent, font: 'inter',
  transparency: 42, blur: 22, radius: 16, density: 'comfortable',
});

function defaultUi() {
  const today = Dates.today();
  return { page: 'home', calMonth: Dates.month(today), calDay: today, taskDay: today, settingsSection: 'clock' };
}
function defaultState() {
  return { items: [], settings: clone(DEFAULT_SETTINGS), ui: defaultUi() };
}
function makeItem(type, fields = {}) {
  const t = nowISO();
  return { id: uid(), type, createdAt: t, updatedAt: t, title: '', content: '', meta: {}, links: [], ...fields };
}

const isIso = (v) => typeof v === 'string' && !Number.isNaN(Date.parse(v));

/** Type-specific clean-up. Unknown types pass through untouched so newer data survives. */
const ITEM_NORMALISERS = {
  task(it) {
    it.meta.date = Dates.isKey(it.meta.date) ? it.meta.date : Dates.key(new Date(it.createdAt));
    it.meta.done = it.meta.done === true;
    it.meta.order = Number.isFinite(it.meta.order) ? it.meta.order : null; // filled in by normaliseState
    it.meta.color = isHex(it.meta.color) ? it.meta.color.toLowerCase() : null;
    return it;
  },
  event(it) {
    const m = it.meta;
    if (!Dates.isKey(m.start)) return null;
    if (!Dates.isKey(m.end) || m.end < m.start) m.end = m.start;
    m.allDay = m.allDay === true || !Dates.isTime(m.startTime);
    m.startTime = Dates.isTime(m.startTime) ? m.startTime : null;
    m.endTime = Dates.isTime(m.endTime) ? m.endTime : m.startTime;
    return it;
  },
  capture(it) {
    it.meta.kind = typeof it.meta.kind === 'string' ? it.meta.kind : 'text';
    it.meta.category = typeof it.meta.category === 'string' ? it.meta.category : '';
    return it;
  },
  note(it) {

function normaliseItem(raw) {
  if (!isObj(raw) || typeof raw.id !== 'string' || !raw.id || typeof raw.type !== 'string' || !raw.type) return null;

    meta: isObj(raw.meta) ? { ...raw.meta } : {},
    links: Array.isArray(raw.links) ? raw.links.filter((l) => typeof l === 'string') : [],

    clockShape: oneOf(s.clockShape, CLOCK_SHAPES, d.clockShape),
    showSeconds: bool(s.showSeconds, d.showSeconds),
    showTime: bool(s.showTime, d.showTime),
    showDate: bool(s.showDate, d.showDate),

      line: isHex(ct.line) ? ct.line.toLowerCase() : d.customTheme.line,
      text: isHex(ct.text) ? ct.text.toLowerCase() : d.customTheme.text,
    },
    accent: isHex(s.accent) ? s.accent.toLowerCase() : d.accent,

    calDay: Dates.isKey(u.calDay) ? u.calDay : d.calDay,

/** Gives every task a position within its day (older data has none). */
function assignTaskOrder(items) {

/** Accepts anything shaped roughly like state and returns a complete, valid state. */

/* ---------- State management ----------

   notifies subscribers with a reason so they can decide what to do. */
const Store = (() => {
  let state = defaultState();

    Store.update((s) => {
      if (s.items.some((i) => i.id === token.item.id)) return;
      s.items.splice(Math.min(token.index, s.items.length), 0, token.item);
    }, 'items');
  },
};
const Settings = {
  get: () => Store.get().settings,
  set(patch) { Store.update((s) => Object.assign(s.settings, patch), 'settings'); },
};
const UI = {
  get: () => Store.get().ui,
  set(patch) { Store.update((s) => Object.assign(s.ui, patch), 'ui'); },
};

/* ---------- Data storage ----------
   The storage adapter is the only code that touches localStorage.
   localStorage suits today's text-only data; larger content (files,
   images) should move to IndexedDB by swapping this adapter, with items
   keeping only references to the stored blobs. */
const STORAGE_KEY = 'still.state';
const LocalAdapter = {
  read: (key = STORAGE_KEY) => localStorage.getItem(key),
  write: (value, key = STORAGE_KEY) => localStorage.setItem(key, value),
};

const Persistence = (() => {
  let lastWritten = null;
  let timer = 0;
  let failing = false;
  const flushers = []; // views with debounced input (quick notes) push pending text first
  const serialise = (state) => JSON.stringify({ format: 'still-local', version: SCHEMA_VERSION, data: state });

  function load() {
    let raw;
    try { raw = LocalAdapter.read(); }
    catch { return { state: defaultState(), warning: 'Local storage is unavailable, so changes won’t be kept after closing. Use Save to keep a backup.' }; }
    if (!raw) return { state: defaultState(), firstRun: true };
    let result;
    try { result = Backup.decode(JSON.parse(raw)); } catch { result = { ok: false }; }
    if (!result.ok) {
      // Never discard what we can't read: keep the raw text beside the new state.
      try { LocalAdapter.write(raw, `${STORAGE_KEY}.unreadable-${Date.now()}`); } catch { /* storage full */ }
      return { state: defaultState(), warning: 'Saved data couldn’t be read. A copy was kept and STILL started fresh.' };
    }
    lastWritten = serialise(result.data);
    return { state: result.data };
  }
  function flushPending() { flushers.forEach((fn) => fn()); }
  function save() {
    flushPending();
    clearTimeout(timer); timer = 0;
    const state = Store.get();
    if (!isValidState(state)) { console.error('STILL: refusing to persist invalid state'); return; }
    const text = serialise(state);
    if (text === lastWritten) return;
    try {
      LocalAdapter.write(text);
      lastWritten = text;
      failing = false;
    } catch (err) {
      console.error('STILL: local save failed', err);
      if (!failing) Toast.show('Couldn’t save on this device — storage may be full. Use Save to download a backup.', { type: 'error', duration: 6000 });
      failing = true;
    }
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(save, 250); }
  function keepCopy(state, label) {
    try { LocalAdapter.write(serialise(state), `${STORAGE_KEY}.${label}`); } catch { /* best effort */ }
  }
  // Write everything (including pending typing) when the page is hidden or closed.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);
  return { load, save, schedule, keepCopy, flushPending, onFlush: (fn) => flushers.push(fn) };
})();

/* ---------- Backup and restoration ----------
   Backup file format (documented in README.md):
     { format: "still-backup", version: 1, app: "STILL",
       createdAt: ISO-8601, data: { items, settings, ui, …unknown } }
   Older versions are upgraded through MIGRATIONS; newer versions are
   refused rather than guessed at. Missing fields take defaults and
   unknown fields are preserved. */
const Backup = (() => {
  const FORMAT = 'still-backup';
  const MAX_BYTES = 50 * 1024 * 1024;
  /** MIGRATIONS[n] upgrades data from version n to n + 1. */
  const MIGRATIONS = {};
  const fail = (error) => ({ ok: false, error });

  function encode(state) {
    return { format: FORMAT, version: SCHEMA_VERSION, app: 'STILL', createdAt: nowISO(), data: clone(state) };
  }
  function decode(obj) {
    if (!isObj(obj)) return fail('it isn’t a STILL backup.');
    let version; let data;
    if (obj.format === FORMAT || obj.format === 'still-local') { version = obj.version; data = obj.data; }
    else if (Array.isArray(obj.items) && isObj(obj.settings)) { version = 1; data = obj; } // bare state
    else return fail('it isn’t a STILL backup.');
    if (!Number.isInteger(version) || version < 1) return fail('the backup version is missing.');
    if (version > SCHEMA_VERSION) return fail('it was made by a newer version of STILL.');
    if (!isObj(data)) return fail('the backup has no data.');
    if ('items' in data && !Array.isArray(data.items)) return fail('its items are damaged.');
    if ('settings' in data && !isObj(data.settings)) return fail('its settings are damaged.');
    for (let v = version; v < SCHEMA_VERSION; v++) data = MIGRATIONS[v](data);
    return { ok: true, data: normaliseState(data), createdAt: isIso(obj.createdAt) ? obj.createdAt : null };
  }

  function download() {
    try {
      Persistence.flushPending();
      const json = JSON.stringify(encode(Store.get()), null, 2);
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = h('a', { href: url, download: `dashboard-backup-${Dates.today()}.json` });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      Toast.show('Saved — backup downloaded');
    } catch (err) {
      console.error('STILL: backup failed', err);
      Toast.show('Save error — the backup couldn’t be created.', { type: 'error' });
    }
  }

  function summary(result) {
    const counts = {};
    for (const it of result.data.items) counts[it.type] = (counts[it.type] || 0) + 1;
    const parts = [];
    if (counts.task) parts.push(pluralise(counts.task, 'task'));
    if (counts.event) parts.push(pluralise(counts.event, 'event'));
    if (counts.capture) parts.push(pluralise(counts.capture, 'capture'));
    if (counts.note) parts.push('notes');
    const known = (counts.task || 0) + (counts.event || 0) + (counts.capture || 0) + (counts.note || 0);
    const other = result.data.items.length - known;
    if (other) parts.push(pluralise(other, 'other item'));
    const when = result.createdAt ? `Backup from ${Fmt.dateTime(result.createdAt)}` : 'Backup';
    return `${when} · ${parts.length ? parts.join(', ') : 'no items'}`;
  }

  /** Read → parse → validate → confirm → restore. Nothing changes until the user confirms. */
  async function restoreFromFile(file) {
    if (!file) return;
    if (file.size > MAX_BYTES) { Toast.show('Invalid file — it’s too large to be a STILL backup.', { type: 'error' }); return; }
    let text;
    try { text = await file.text(); }
    catch { Toast.show('Load error — the file couldn’t be read.', { type: 'error' }); return; }
    let parsed;
    try { parsed = JSON.parse(text); }
    catch { Toast.show('Invalid file — it isn’t valid JSON.', { type: 'error' }); return; }
    const result = decode(parsed);
    if (!result.ok) { Toast.show(`Invalid file — ${result.error}`, { type: 'error' }); return; }

    const confirmed = await Dialog.confirm({
      title: 'Restore backup?',
      message: 'This will replace your current data. Are you sure you want to continue?',
      detail: summary(result),
      confirmLabel: 'Confirm',
    });
    if (!confirmed) return;
    try {
      Persistence.keepCopy(Store.get(), 'before-restore');
      Store.replace(result.data, 'restore');
      Persistence.save();
      Navigation.syncHash();
      Toast.show('Loaded — your backup has been restored');
    } catch (err) {
      console.error('STILL: restore failed', err);
      Toast.show('Load error — your existing data was left unchanged.', { type: 'error' });
    }
  }
  return { encode, decode, download, restoreFromFile };
})();

/* ---------- Search ----------
   One text index over every item type. Tasks use it today; global search
   can call the same function with more types. */
const Search = {
  text(item) { return [item.title, item.content, item.meta && item.meta.category].filter(Boolean).join(' ').toLowerCase(); },
  query(q, { types } = {}) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    return Items.all().filter((it) => (!types || types.includes(it.type)) && terms.every((t) => Search.text(it).includes(t)));
  },
};

/* ---------- Domain helpers ---------- */
const Tasks = {
  on(day) {
    return Items.all('task').filter((t) => t.meta.date === day)
      .sort((a, b) => (a.meta.order - b.meta.order) || a.createdAt.localeCompare(b.createdAt));
  },
  progress(day) { const list = Tasks.on(day); return { total: list.length, done: list.filter((t) => t.meta.done).length }; },
  nextOrder(day) { return Tasks.on(day).reduce((max, t) => Math.max(max, t.meta.order), -1) + 1; },
  /** Writes positions for a day's tasks in the given id order (one store update). */
  reorder(ids) {
    Store.update((s) => {
      ids.forEach((id, i) => { const t = s.items.find((x) => x.id === id); if (t) t.meta.order = i; });
    }, 'items');
  },
  move(id, delta) {
    const task = Items.get(id);
    if (!task) return false;
    const ids = Tasks.on(task.meta.date).map((t) => t.id);
    const i = ids.indexOf(id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= ids.length) return false;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    Tasks.reorder(ids);
    return true;
  },
};
const Events = {
  occursOn(ev, day) { return ev.meta.start <= day && day <= ev.meta.end; },
  on(day) {
    return Items.all('event')
      .filter((e) => Events.occursOn(e, day))
      .sort((a, b) => (a.meta.allDay === b.meta.allDay ? 0 : a.meta.allDay ? -1 : 1)
        || (a.meta.startTime || '').localeCompare(b.meta.startTime || '')
        || a.title.localeCompare(b.title));
  },
  /** Map of day → number of events, for the visible calendar range only. */
  countRange(from, to) {
    const counts = new Map();
    for (const ev of Items.all('event')) {
      if (ev.meta.end < from || ev.meta.start > to) continue;
      const a = ev.meta.start < from ? from : ev.meta.start;
      const b = ev.meta.end > to ? to : ev.meta.end;
      for (const day of Dates.range(a, b)) counts.set(day, (counts.get(day) || 0) + 1);
    }
    return counts;
  },
  label(ev, day) {
    const { allDay, start, end, startTime, endTime } = ev.meta;
    const h24 = Settings.get().clock24;
    if (start === end) return allDay ? 'All day' : `${Fmt.time(startTime, h24)} – ${Fmt.time(endTime, h24)}`;
    const span = `${Fmt.shortDate(start)} – ${Fmt.shortDate(end)}`;
    if (allDay) return `All day · ${span}`;
    if (day === start) return `From ${Fmt.time(startTime, h24)} · ${span}`;
    if (day === end) return `Until ${Fmt.time(endTime, h24)} · ${span}`;
    return `All day · ${span}`;
  },
};

/* ---------- Toasts ---------- */
const Toast = (() => {
  const host = $('#toasts');
  // As a popover the stack sits in the top layer, above open dialogs.
  const canPopover = typeof host.showPopover === 'function';
  if (canPopover) host.setAttribute('popover', 'manual');
  function raise() {
    if (!canPopover) return;
    try { if (host.matches(':popover-open')) host.hidePopover(); host.showPopover(); } catch { /* ignore */ }
  }
  function dismiss(el) {
    if (!el.isConnected || el.classList.contains('is-leaving')) return;
    el.classList.add('is-leaving');
    setTimeout(() => {
      el.remove();
      if (canPopover && !host.children.length) { try { host.hidePopover(); } catch { /* ignore */ } }
    }, prefersReducedMotion() ? 0 : 200);
  }
  function show(message, { type = 'info', action = null, duration = action ? 5000 : 3000 } = {}) {
    const el = h('div', { class: `toast toast--${type}`, role: type === 'error' ? 'alert' : null },
      h('span', { class: 'toast__dot', 'aria-hidden': 'true' }),
      h('span', { class: 'toast__msg', text: message }),
      action && h('button', { class: 'btn btn--ghost btn--sm', type: 'button', text: action.label, onclick: () => { action.run(); dismiss(el); } }));
    host.append(el);
    while (host.children.length > 3) host.firstElementChild.remove();
    raise();
    let timer = setTimeout(() => dismiss(el), duration);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(() => dismiss(el), 1500); });
    return el;
  }
  return { show };
})();

/** Delete with an Undo toast: nothing is ever removed silently. */
function removeWithUndo(id, noun) {
  const token = Items.remove(id);
  if (token) Toast.show(`${noun} deleted`, { action: { label: 'Undo', run: () => Items.restore(token) } });
}

/* ---------- Dialogs ----------
   Native <dialog> gives focus trapping, Escape and the top layer. Each
   dialog is created on open and removed on close, so they can stack. */
const Dialog = (() => {
  let seq = 0;
  function open({ title, body, sub = null, actions = [], className = '', dismissOnBackdrop = true, onClose = null, initialFocus = null, onSubmit = null }) {
    const titleId = `dialog-title-${++seq}`;
    const returnFocus = document.activeElement;
    const form = h('form', { class: 'dialog__form', novalidate: true, style: 'display:contents' });
    const el = h('dialog', { class: `dialog ${className}`.trim(), 'aria-labelledby': titleId }, form);
    let closed = false;

    const buttons = actions.map((a) => (a === 'spacer' ? h('span', { class: 'spacer' }) : a instanceof Node ? a : h('button', {
      class: `btn ${a.variant ? `btn--${a.variant}` : ''}`.trim(),
      type: a.submit ? 'submit' : 'button',
      text: a.label,
      onclick: a.submit ? null : () => (a.run ? a.run(close) : close()),
    })));
    appendChildren(form, [
      h('div', { class: 'dialog__head' },
        h('h2', { class: 'dialog__title', id: titleId, text: title }),
        h('button', { class: 'icon-btn icon-btn--sm', type: 'button', 'aria-label': 'Close', onclick: () => close() }, icon('x'))),
      sub ? h('div', { class: 'dialog__sub' }, sub) : null,
      h('div', { class: 'dialog__body' }, body),
      buttons.length ? h('div', { class: 'dialog__foot' }, buttons) : null,
    ]);
    form.addEventListener('submit', (e) => { e.preventDefault(); if (onSubmit) onSubmit(close); });

    function close(result) {
      if (closed) return;
      closed = true;
      const finish = () => {
        el.close();
        el.remove();
        if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll: true });
        if (onClose) onClose(result);
      };
      if (prefersReducedMotion()) finish();
      else { el.classList.add('is-closing'); setTimeout(finish, 140); }
    }
    el.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    // Close on a backdrop click (press and release both outside the content box).
    let downOnBackdrop = false;
    el.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === el && isOutside(el, e); });
    el.addEventListener('click', (e) => {
      if (dismissOnBackdrop && downOnBackdrop && e.target === el && isOutside(el, e)) close();
      downOnBackdrop = false;
    });

    document.body.append(el);
    el.showModal();
    const focusEl = initialFocus ? (typeof initialFocus === 'string' ? $(initialFocus, el) : initialFocus) : null;
    if (focusEl) focusEl.focus();
    return { el, close };
  }
  function isOutside(el, e) {
    const r = el.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  }
  function confirm({ title, message, detail = '', confirmLabel = 'Confirm', danger = false }) {
    return new Promise((resolve) => {
      let answer = false;
      open({
        title,
        body: [h('p', { text: message }), detail ? h('p', { class: 'confirm__detail', text: detail }) : null],
        actions: ['spacer',
          { label: 'Cancel', run: (close) => close() },
          { label: confirmLabel, variant: danger ? 'danger' : 'primary', run: (close) => { answer = true; close(); } }],
        initialFocus: '.dialog__foot .btn:last-child',
        onClose: () => resolve(answer),
      });
    });
  }
  const anyOpen = () => !!$('dialog[open]');
  return { open, confirm, anyOpen };
})();

/* ---------- Popover menus ----------
   One small glass menu at a time, anchored to the button that opened it.
   Closes on Escape, an outside click, scrolling or resizing. `key`
   identifies the owner so a re-rendered anchor still toggles it. */
const Popover = (() => {
  let current = null;
  function open({ anchor, key, content, label, getAnchor }) {
    if (current && current.key === key) { close(true); return; }
    close(false);
    const el = h('div', { class: 'popover', role: 'menu', 'aria-label': label }, content);
    document.body.append(el);
    place(el, anchor);
    anchor.setAttribute('aria-expanded', 'true');
    const onDown = (e) => { if (!el.contains(e.target) && !(current && current.anchorEl().contains(e.target))) close(false); };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const items = $$('.menu__item:not(:disabled)', el);
        if (!items.length) return;
        e.preventDefault();
        const i = items.indexOf(document.activeElement);
        items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
      }
    };
    const onScroll = (e) => { if (!el.contains(e.target)) close(false); };
    const onResize = () => close(false);
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onResize);
    current = {
      key, el,
      anchorEl: () => (getAnchor && getAnchor()) || anchor,
      cleanup() {
        document.removeEventListener('pointerdown', onDown, true);
        document.removeEventListener('keydown', onKey, true);
        window.removeEventListener('scroll', onScroll, true);
        window.removeEventListener('resize', onResize);
      },
    };
    const first = $('.menu__item:not(:disabled)', el);
    if (first) first.focus({ preventScroll: true });
  }
  function place(el, anchor) {
    const a = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const hgt = el.offsetHeight;
    const m = 8;
    let left = Math.min(a.right - w, window.innerWidth - w - m);
    left = Math.max(m, left);
    let top = a.bottom + 6;
    if (top + hgt > window.innerHeight - m) top = Math.max(m, a.top - hgt - 6);
    el.style.left = `${Math.round(left)}px`;
    el.style.top = `${Math.round(top)}px`;
    el.style.transformOrigin = top < a.top ? 'bottom right' : 'top right';
  }
  function close(returnFocus) {
    if (!current) return;
    const { el, cleanup, anchorEl } = current;
    current = null;
    cleanup();
    const anchor = anchorEl();
    if (anchor) {
      anchor.setAttribute('aria-expanded', 'false');
      if (returnFocus && anchor.isConnected) anchor.focus({ preventScroll: true });
    }
    if (prefersReducedMotion()) el.remove();
    else { el.classList.add('is-closing'); setTimeout(() => el.remove(), 120); }
  }
  const isOpenFor = (key) => !!current && current.key === key;
  return { open, close, isOpenFor };
})();

/** Colour picker: palette swatches, optional "None", and a custom colour wheel. */
function swatchPicker({ value, onPick, allowNone = false, label = 'Colour' }) {
  const custom = h('input', { type: 'color', value: isHex(value) ? value : '#4d9078', 'aria-label': 'Custom colour' });
  const customWrap = h('label', { class: 'swatch swatch--custom', title: 'Custom colour' }, custom);
  const wrap = h('div', { class: 'swatches', role: 'group', 'aria-label': label },
    allowNone ? h('button', { class: 'swatch swatch--none', type: 'button', title: 'None', 'aria-label': 'No colour', dataset: { color: '' } }, icon('ban')) : null,
    PALETTE.map((p) => h('button', {
      class: 'swatch', type: 'button', title: p.name, 'aria-label': p.name,
      style: `--c:${p.hex};--on-c:${readable(p.hex)}`, dataset: { color: p.hex },
    }, icon('check'))),
    customWrap);
  const mark = (color) => {
    const c = isHex(color) ? color.toLowerCase() : '';
    $$('.swatch[data-color]', wrap).forEach((s) => s.setAttribute('aria-pressed', String(s.dataset.color === c)));
    const isCustom = !!c && !PALETTE.some((p) => p.hex === c);
    customWrap.setAttribute('aria-pressed', String(isCustom));
    if (isCustom) customWrap.style.setProperty('--c', c);
  };
  wrap.addEventListener('click', (e) => {
    const s = e.target.closest('.swatch[data-color]');
    if (!s) return;
    const c = s.dataset.color || null;
    mark(c);
    onPick(c);
  });
  custom.addEventListener('input', () => { const c = custom.value.toLowerCase(); mark(c); onPick(c); });
  mark(value);
  return wrap;
}

/* ---------- Theme ----------
   The theme engine in <head> owns the variables; this re-applies it when
   the relevant settings change. */
const Theme = (() => {
  let applied = '';
  const KEYS = ['theme', 'customTheme', 'accent', 'font', 'transparency', 'blur', 'radius', 'density'];
  function apply() {
    const s = Settings.get();
    const key = JSON.stringify(KEYS.map((k) => s[k]));
    if (key === applied) return;
    applied = key;
    window.StillTheme.apply(s);
  }
  return { apply };
})();

/* ---------- Clock face artwork ----------
   Draws a face style (minimal, classic, modern, digital) in a shape
   (circle, rounded square, squircle, hexagon) into a 200×200 SVG. The
   shape is a radius function r(angle), so the rim, ticks and numerals
   all follow it. Used by the live clock and the Settings previews. */
const ClockFace = (() => {
  const C = 100;
  const R = 95;
  const rad = (deg) => (deg * Math.PI) / 180;
  const superellipse = (n) => (deg) => {
    const x = Math.abs(Math.sin(rad(deg)));
    const y = Math.abs(Math.cos(rad(deg)));
    return 1 / ((x ** n + y ** n) ** (1 / n));
  };
  const SHAPES = {
    circle: () => 1,
    rounded: superellipse(7),
    squircle: superellipse(4),
    hexagon: (deg) => { let d = ((deg % 60) + 60) % 60; if (d > 30) d -= 60; return Math.cos(rad(30)) / Math.cos(rad(d)); },
  };
  const point = (deg, r) => [C + Math.sin(rad(deg)) * r, C - Math.cos(rad(deg)) * r];
  const fx = (n) => n.toFixed(2);

  function outline(shape) {
    if (shape === 'circle') return svg('circle', { cx: C, cy: C, r: R });
    const f = SHAPES[shape];
    let d = '';
    for (let a = 0; a < 360; a += 2) { const [x, y] = point(a, R * f(a)); d += `${a ? 'L' : 'M'}${fx(x)} ${fx(y)}`; }
    return svg('path', { d: `${d}Z` });
  }
  function radial(deg, r1, r2, attrs) {
    const [x1, y1] = point(deg, r1);
    const [x2, y2] = point(deg, r2);
    return svg('line', { x1: fx(x1), y1: fx(y1), x2: fx(x2), y2: fx(y2), ...attrs });
  }
  function hand(parent, cls, length, tail, width) {
    const g = svg('g', { class: `clock__hand ${cls}` });
    g.append(svg('line', { x1: C, y1: C + tail, x2: C, y2: C - length, 'stroke-width': width }));
    parent.append(g);
    return g;
  }

  /** Returns { h, m, s } hand groups to rotate, or null for the digital face. */
  function draw(target, { face = 'minimal', shape = 'circle', seconds = true, preview = false } = {}) {
    target.replaceChildren();
    const k = preview ? 2.4 : 1; // tiny previews need heavier strokes
    if (face === 'digital') {
      if (preview) target.append(Object.assign(svg('text', { x: C, y: C + 4, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 64, class: 'clock__digits' }), { textContent: '10:10' }));
      return null;
    }
    const f = SHAPES[shape] || SHAPES.circle;
    const rim = outline(shape);
    rim.setAttribute('class', 'clock__rim');
    rim.setAttribute('stroke-width', (face === 'classic' ? 1.6 : 1) * k);
    target.append(rim);

    for (let i = 0; i < 60; i++) {
      const a = i * 6;
      const hour = i % 5 === 0;
      const edge = R * f(a);
      if (face === 'modern') {
        if (!hour) continue;
        const major = i % 15 === 0;
        target.append(radial(a, edge * (major ? 0.72 : 0.79), edge * 0.92, { class: 'clock__marker', 'stroke-width': (major ? 6 : 4) * (preview ? 1.6 : 1) }));
      } else if (face === 'classic') {
        if (preview && !hour) continue;
        target.append(radial(a, edge * (hour ? 0.9 : 0.925), edge * 0.955, { class: `clock__tick${hour ? ' clock__tick--hour' : ''}`, 'stroke-width': (hour ? 1.4 : 0.7) * k }));
      } else {
        if (preview && !hour) continue;
        target.append(radial(a, edge * (hour ? 0.86 : 0.915), edge * 0.955, { class: `clock__tick${hour ? ' clock__tick--hour' : ''}`, 'stroke-width': (hour ? 1.6 : 0.8) * k }));
      }
    }
    if (face === 'classic') {
      for (let n = 1; n <= 12; n++) {
        if (preview && n % 3) continue;
        const a = n * 30;
        const [x, y] = point(a, R * f(a) * (preview ? 0.66 : 0.75));
        const t = svg('text', { x: fx(x), y: fx(y), 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': preview ? 40 : 15, class: 'clock__num' });
        t.textContent = String(n);
        target.append(t);
      }
    }

    const L = R * (shape === 'hexagon' ? 0.866 : 1);
    const spec = {
      minimal: { h: [0.5, 0, 2.6], m: [0.76, 0, 1.6], s: [0.84, 0.12, 0.9, 'clock__hand--quiet'] },
      classic: { h: [0.48, 0.08, 4.4], m: [0.72, 0.1, 3], s: [0.82, 0.18, 1.1, 'clock__hand--quiet'] },
      modern: { h: [0.5, 0, 6], m: [0.78, 0, 4], s: [0.86, 0.16, 1.6, 'clock__hand--accent'] },
    }[face] || {};
    const hands = {
      h: hand(target, 'clock__hand--hour', L * spec.h[0], L * spec.h[1], spec.h[2] * k),
      m: hand(target, 'clock__hand--minute', L * spec.m[0], L * spec.m[1], spec.m[2] * k),
      s: seconds ? hand(target, `clock__hand--second ${spec.s[3]}`, L * spec.s[0], L * spec.s[1], spec.s[2] * k) : null,
    };
    if (hands.s && face === 'modern') hands.s.append(svg('circle', { cx: C, cy: C, r: 4 * k }));
    target.append(svg('circle', { class: face === 'modern' ? 'clock__pin clock__pin--accent' : 'clock__pin', cx: C, cy: C, r: (face === 'modern' ? 3 : 3.6) * k }));
    target.append(svg('circle', { class: 'clock__pin-core', cx: C, cy: C, r: 1.3 * k }));
    if (preview) setTime(hands, 10, 10, 30);
    return hands;
  }
  function setTime(hands, hr, min, sec) {
    if (!hands) return;
    hands.h.setAttribute('transform', `rotate(${fx(((hr % 12) + min / 60) * 30)} ${C} ${C})`);
    hands.m.setAttribute('transform', `rotate(${fx((min + sec / 60) * 6)} ${C} ${C})`);
    if (hands.s) hands.s.setAttribute('transform', `rotate(${fx(sec * 6)} ${C} ${C})`);
  }
  return { draw, setTime };
})();

/* ---------- Clock ----------
   One Date per frame drives both the hands and the digits, so they can
   never disagree. Runs only while Home is visible. */
const Clock = (() => {
  const root = $('#clock');
  const face = $('#clock-svg');
  const timeEl = $('#clock-time');
  const ampmEl = $('#clock-ampm');
  let hands = null;
  let drawn = '';
  let raf = 0;
  let lastDigital = '';

  function ensureFace() {
    const s = Settings.get();
    const key = `${s.clockFace}|${s.clockShape}|${s.showSeconds}`;
    if (key === drawn) return;
    drawn = key;
    hands = ClockFace.draw(face, { face: s.clockFace, shape: s.clockShape, seconds: s.showSeconds });
    root.dataset.face = s.clockFace;
  }
  function paint(now) {
    const smooth = !prefersReducedMotion();
    const sec = now.getSeconds() + (smooth ? now.getMilliseconds() / 1000 : 0);
    ClockFace.setTime(hands, now.getHours(), now.getMinutes(), sec);
    const p = Fmt.timeParts(now.getHours(), now.getMinutes(), Settings.get().clock24);
    const digital = `${p.time}|${p.suffix}`;
    if (digital !== lastDigital) {
      lastDigital = digital;
      timeEl.textContent = p.time;
      timeEl.dateTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      ampmEl.textContent = p.suffix;
    }
  }
  function frame() { paint(new Date()); raf = requestAnimationFrame(frame); }
  function start() { if (!raf) frame(); }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  function autoCity() {
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      const city = tz.split('/').pop();
      return city && city !== 'UTC' ? city.replace(/_/g, ' ') : 'Local time';
    } catch { return 'Local time'; }
  }
  function zoneName() {
    try { return new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(new Date()).find((p) => p.type === 'timeZoneName').value; }
    catch { return ''; }
  }
  /** Static parts: face, location, zone, date line; forces the digits to redraw after a format change. */
  function render() {
    const s = Settings.get();
    ensureFace();
    const zone = zoneName();
    const showsTime = s.showTime || s.clockFace === 'digital';
    $('#clock-zone').textContent = zone;
    $('#clock-location').textContent = [s.location.trim() || autoCity(), showsTime ? '' : zone].filter(Boolean).join(' · ');
    root.classList.toggle('no-time', !s.showTime && s.clockFace !== 'digital');
    const dateEl = $('#clock-date');
    dateEl.hidden = !s.showDate;
    if (s.showDate) dateEl.textContent = Fmt.dayMonth(Dates.today());
    lastDigital = '';
    if (raf) paint(new Date());
  }
  return { start, stop, render, autoCity };
})();

/* ---------- Quick notes ----------
   A single "note" item (meta.quick) behind a borderless text area. Typing
   is buffered briefly so the whole app doesn't redraw on every key; the
   buffer is flushed before every save and backup. */
const QuickNotes = (() => {
  const area = $('#quick-notes');
  const status = $('#notes-status');
  const sendBtn = $('#notes-send');
  let timer = 0;
  let statusTimer = 0;
  let dirty = false;
  const item = () => Items.all('note').find((n) => n.meta.quick) || null;

  function flush() {
    clearTimeout(timer);
    if (!dirty) return;
    dirty = false;
    const value = area.value;
    const it = item();
    if (it) { if (it.content !== value) Items.update(it.id, { content: value }); }
    else if (value) Items.create('note', { title: 'Quick notes', content: value, meta: { quick: true } });
    status.classList.add('is-visible');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => status.classList.remove('is-visible'), 1200);
  }
  function sync(force = false) {
    if (!force && (dirty || document.activeElement === area)) return;
    if (force) { dirty = false; clearTimeout(timer); }
    const it = item();
    const value = it ? it.content : '';
    if (area.value !== value) area.value = value;
    updateButton();
  }
  const updateButton = () => { sendBtn.disabled = !area.value.trim(); };

  /** Moves the pad's text into the Notes page Inbox and clears the pad (with Undo). */
  function sendToNotes() {
    flush();
    const text = area.value.trim();
    const it = item();
