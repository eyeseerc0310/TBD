<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0f12">
<meta name="description" content="STILL — a calm, local-first personal workspace.">
<title>STILL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171b'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%237c8cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%237c8cff'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   STILL — stylesheet
   1. Design tokens   2. Base   3. Primitives (buttons, inputs, …)
   4. Shell (top bar, navigation)   5. Pages   6. Home panels
   7. Overlays (dialogs, toasts, drop zone)   8. Responsive   9. Motion
   Every component reads from the tokens below; nothing is styled ad hoc.
   ===================================================================== */

/* ---------- 1. Design tokens ---------- */
:root {
  /* Surfaces */
  --bg: #0e0f12;
  --surface: rgba(30, 32, 38, 0.58);
  --surface-raised: rgba(26, 28, 33, 0.9);
  --surface-sunken: rgba(0, 0, 0, 0.22);
  --hover: rgba(255, 255, 255, 0.05);
  --hover-strong: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.12);

  /* Text */
  --text: #ececef;
  --text-2: #a2a5ad;
  --text-3: #6c7079;

  /* Accent (set at runtime from Settings) */
  --accent: #7c8cff;
  --on-accent: #0e0f12;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 55%, transparent);
  --danger: #ef7a7a;

  /* Typography */
  --font: Inter, "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-md: 16px;
  --fs-lg: 20px;
  --fs-xl: 26px;
  --fs-display: 46px;

  /* Spacing (4px scale) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --gutter: var(--s8);

  /* Shape */
  --r-panel: 16px;
  --r-ctl: 9px;
  --r-sm: 6px;
  --ctl-h: 34px;
  --ctl-h-sm: 28px;
  --icon: 18px;
  --icon-sm: 16px;
  --topbar-h: 56px;

  /* Depth */
  --blur: 22px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.035) inset, 0 24px 48px -24px rgba(0, 0, 0, 0.65);
  --shadow-pop: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 30px 80px -20px rgba(0, 0, 0, 0.75);

  /* Motion: slow-fast-slow */
  --ease: cubic-bezier(0.45, 0, 0.2, 1);
  --t-fast: 120ms;
  --t: 200ms;
  --t-slow: 320ms;
}

/* ---------- 2. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 var(--fs-base)/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss03";
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
kbd {
  font: 500 var(--fs-xs)/1 var(--font);
  min-width: 20px; height: 20px; padding: 0 5px;
  display: inline-grid; place-items: center;
  border-radius: 5px; border: 1px solid var(--border-strong);
  background: var(--surface-sunken); color: var(--text-2);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.icon {
  width: var(--icon); height: var(--icon); flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.icon--sm { width: var(--icon-sm); height: var(--icon-sm); }

/* Ambient light behind the glass */
.ambient {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vmax 45vmax at 8% -12%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 62%),
    radial-gradient(55vmax 40vmax at 104% 112%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    radial-gradient(40vmax 30vmax at 82% 6%, rgba(140, 150, 170, 0.06), transparent 70%),
    linear-gradient(180deg, #121317, #0c0d10);
  transition: background var(--t-slow) var(--ease);
}

/* Glass surface, shared by panels, the top bar, dialogs and toasts */
.glass {
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
}

/* ---------- 3. Primitives ---------- */
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  height: var(--ctl-h); padding: 0 var(--s4);
  border-radius: var(--r-ctl);
  border: 1px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: var(--fs-sm); font-weight: 500; white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:hover { background: var(--hover-strong); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn--primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--hover); color: var(--text); }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: transparent; }
.btn--danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn--sm { height: var(--ctl-h-sm); padding: 0 var(--s3); }
.btn--square { width: var(--ctl-h); padding: 0; }

.icon-btn {
  position: relative;
  width: var(--ctl-h); height: var(--ctl-h);
  display: inline-grid; place-items: center; flex: none;
  border-radius: var(--r-ctl);
  color: var(--text-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.icon-btn:hover { background: var(--hover-strong); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn--sm { width: var(--ctl-h-sm); height: var(--ctl-h-sm); border-radius: var(--r-sm); }
.icon-btn--sm .icon { width: var(--icon-sm); height: var(--icon-sm); }
.icon-btn--danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

/* Inputs */
.input {
  width: 100%; height: var(--ctl-h);
  padding: 0 var(--s3);
  border-radius: var(--r-ctl);
  border: 1px solid var(--border);
  background: var(--surface-sunken);
  color: var(--text);
  font-size: var(--fs-base);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.input::placeholder { color: var(--text-3); }
.input:hover { border-color: var(--border-strong); }
.input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
textarea.input { height: auto; min-height: 104px; padding: var(--s3); line-height: 1.5; resize: vertical; }
input[type="date"].input, input[type="time"].input { color-scheme: dark; }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
.input--inline { height: 30px; padding: 0 var(--s2); }

.search { position: relative; flex: 1; min-width: 0; }
.search > .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .input { padding-left: 34px; padding-right: 34px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; transition: opacity var(--t-fast); }
.search .input:focus ~ kbd, .search .input:not(:placeholder-shown) ~ kbd { opacity: 0; }

/* Checkbox (round, used for tasks) */
.check {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 18px; height: 18px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--text-3);
  display: inline-grid; place-items: center;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.check:hover { border-color: var(--text-2); }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check::after {
  content: ""; width: 8px; height: 4.5px;
  border: solid var(--on-accent); border-width: 0 0 1.75px 1.75px;
  transform: translate(0, -1px) rotate(-45deg) scale(0);
  transition: transform var(--t) var(--ease);
}
.check:checked::after { transform: translate(0, -1px) rotate(-45deg) scale(1); }
.check-hit { display: grid; place-items: center; width: 30px; height: 30px; flex: none; cursor: pointer; }

/* Switch */
.switch { display: inline-flex; align-items: center; gap: var(--s3); cursor: pointer; font-size: var(--fs-sm); color: var(--text-2); }
.switch input {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 32px; height: 18px; border-radius: 999px; flex: none;
  background: var(--hover-strong); border: 1px solid var(--border-strong);
  position: relative; cursor: pointer;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
}
.switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%; background: var(--text);
  transition: transform var(--t) var(--ease);
}
.switch input:checked { background: var(--accent); border-color: transparent; }
.switch input:checked::after { transform: translateX(14px); background: var(--on-accent); }

/* Segmented control */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-ctl); background: var(--surface-sunken); border: 1px solid var(--border); }
.seg button {
  height: 26px; padding: 0 var(--s3); border-radius: 6px;
  font-size: var(--fs-sm); font-weight: 500; color: var(--text-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--hover-strong); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip {
  height: 26px; padding: 0 var(--s3); border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-2);
  font-size: var(--fs-sm); font-weight: 500;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.chip:hover { background: var(--hover); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2);
  border-radius: 999px; background: var(--hover); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap;
}

/* Forms */
.form { display: flex; flex-direction: column; gap: var(--s4); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field__label { font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.field__hint { font-size: var(--fs-xs); color: var(--text-3); }
.field-row { display: flex; gap: var(--s3); }
.field-row > * { flex: 1 1 0; min-width: 0; }
.form-error { font-size: var(--fs-sm); color: var(--danger); min-height: 1em; }

/* Tooltips */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; left: 50%; top: calc(100% + 8px); z-index: 40;
  transform: translate(-50%, -3px);
  padding: 5px 8px; border-radius: var(--r-sm);
  background: #1c1e23; border: 1px solid var(--border-strong);
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  color: var(--text); font-size: var(--fs-xs); font-weight: 500; line-height: 1.2; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
[data-tip-align="end"]::after { left: auto; right: 0; transform: translate(0, -3px); }
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 400ms; }
[data-tip-align="end"]:hover::after, [data-tip-align="end"]:focus-visible::after { transform: translate(0, 0); }
@media (hover: none) { [data-tip]::after { display: none; } }

/* Empty states */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s6) var(--s4); text-align: center; color: var(--text-3); font-size: var(--fs-sm); }
.empty .icon { color: var(--text-3); opacity: 0.7; }

/* ---------- 4. Shell ---------- */
.app { display: flex; flex-direction: column; min-height: 100dvh; }

/* The glass lives on ::before so the bar never becomes a containing block
   for the fixed-position mobile navigation inside it. */
.topbar {
  position: sticky; top: var(--s3); z-index: 20; isolation: isolate;
  display: flex; align-items: center; gap: var(--s4);
  height: var(--topbar-h);
  margin: var(--s3) var(--gutter) 0;
  padding: 0 var(--s3) 0 var(--s4);
  border-radius: var(--r-panel);
}
.topbar::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: var(--s2); font-size: 13px; font-weight: 600; letter-spacing: 0.32em; color: var(--text); user-select: none; }
.brand__mark { width: 18px; height: 18px; color: var(--accent); }
.divider { width: 1px; height: 20px; background: var(--border-strong); flex: none; }

.nav { display: flex; align-items: center; gap: var(--s1); }
.nav__btn { position: relative; }
.nav__btn[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
.nav__btn[aria-current="page"] .icon { color: var(--accent); }
.nav__label { display: none; }

.actions { margin-left: auto; display: flex; align-items: center; gap: var(--s1); }

.main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 1680px; margin: 0 auto; padding: var(--s8) var(--gutter) var(--s8); }

/* ---------- 5. Pages ---------- */
.page { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: page-in var(--t-slow) var(--ease); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s6); }
.page-head__title { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
.page-head__sub { margin-top: 6px; color: var(--text-2); font-size: var(--fs-base); text-wrap: pretty; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); }
.subhead { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: var(--s2); }
.count { font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }

/* Placeholder workspaces */
.workspace { flex: 1; display: grid; place-items: center; padding: var(--s10) var(--s6); border-radius: var(--r-panel); min-height: 360px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 380px; gap: var(--s3); }
.empty-state__icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent); margin-bottom: var(--s2); }
.empty-state__icon .icon { width: 24px; height: 24px; }
.empty-state__title { font-size: var(--fs-md); font-weight: 600; }
.empty-state__text { color: var(--text-2); font-size: var(--fs-base); }
.empty-state .btn { margin-top: var(--s3); }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }

/* Inbox (Notes page) */
.inbox { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }
.card { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); border-radius: var(--r-panel); min-height: 132px; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
.card__title { font-size: var(--fs-base); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.card__text { color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.card__foot { margin-top: auto; padding-top: var(--s2); display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-xs); color: var(--text-3); }
.card .icon-btn { margin: -4px -6px 0 0; opacity: 0; transition: opacity var(--t-fast) var(--ease), background var(--t-fast), color var(--t-fast); }
.card:hover .icon-btn, .card:focus-within .icon-btn { opacity: 1; }
@media (hover: none) { .card .icon-btn { opacity: 1; } }

/* ---------- 6. Home panels ---------- */
.dashboard { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: var(--s5); min-height: 600px; }
.panel { display: flex; flex-direction: column; min-height: 0; padding: var(--s5); border-radius: var(--r-panel); }
.panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); height: var(--ctl-h-sm); margin-bottom: var(--s4); flex: none; }
.panel__title { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.panel__meta { font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }
.panel__section { display: flex; flex-direction: column; flex: 1; min-height: 0; margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--border); }
.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 calc(var(--s2) * -1); padding: 0 var(--s2); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* Clock */
.clock { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s6); min-height: 0; }
.clock__face { flex: 0 1 270px; min-height: 120px; width: 100%; display: flex; justify-content: center; }
.clock__face svg { height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; display: block; overflow: visible; }
.clock__rim { fill: rgba(255, 255, 255, 0.015); stroke: var(--border-strong); stroke-width: 1; }
.clock__tick { stroke: var(--text-3); stroke-width: 0.8; stroke-linecap: round; opacity: 0.45; }
.clock__tick--hour { stroke: var(--text-2); stroke-width: 1.6; opacity: 0.9; }
.clock__hand { stroke: var(--text); stroke-linecap: round; }
.clock__hand--hour { stroke-width: 3.6; }
.clock__hand--minute { stroke-width: 2.4; }
.clock__hand--second { stroke: var(--accent); stroke-width: 1.2; }
.clock__pin { fill: var(--accent); }
.clock__pin-core { fill: var(--bg); }
.clock__readout { display: flex; flex-direction: column; align-items: center; gap: var(--s1); }
.clock__digital { display: flex; align-items: baseline; gap: var(--s2); font-size: var(--fs-display); font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock__ampm { font-size: var(--fs-md); font-weight: 500; letter-spacing: 0.04em; color: var(--text-2); }
.clock__location { font-size: var(--fs-base); color: var(--text-2); margin-top: var(--s1); }

/* Calendar */
.cal__now { margin-bottom: var(--s4); flex: none; }
.cal__weekday { font-size: var(--fs-sm); color: var(--text-2); }
.cal__date { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; }
.cal__bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); flex: none; }
.cal__month { font-weight: 500; }
.cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; flex: none; }
.cal__dow { height: 24px; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); }
.cal__day {
  position: relative; height: clamp(28px, 4.2vh, 36px); border-radius: var(--r-sm);
  display: grid; place-items: center;
  font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--text);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.cal__day:hover { background: var(--hover-strong); }
.cal__day.is-outside { color: var(--text-3); }
.cal__day.is-today { color: var(--accent); font-weight: 600; }
.cal__day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal__dots { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.cal__dot { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
.cal__day.is-outside .cal__dot { background: var(--text-3); }
.cal__day[aria-pressed="true"] .cal__dot { background: var(--on-accent); }

.event { display: flex; align-items: stretch; gap: var(--s3); width: 100%; padding: var(--s2); border-radius: var(--r-sm); text-align: left; transition: background var(--t-fast) var(--ease); }
.event:hover { background: var(--hover); }
.event__bar { width: 3px; border-radius: 2px; background: var(--accent); flex: none; }
.event__body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.event__title { font-weight: 500; overflow-wrap: anywhere; }
.event__time { font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Tasks */
.tasks__tools { display: flex; gap: var(--s2); flex: none; }
.week { display: flex; align-items: center; gap: 2px; margin: var(--s4) calc(var(--s2) * -1) 0; flex: none; }
.week__days { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; border-radius: var(--r-ctl); transition: background var(--t-fast) var(--ease); }
.wday:hover { background: var(--hover); }
.wday[aria-pressed="true"] { background: var(--hover-strong); }
.ring { position: relative; width: min(34px, 100%); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring__track { fill: none; stroke: var(--hover-strong); stroke-width: 2.5; }
.ring__fill { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dasharray var(--t-slow) var(--ease), opacity var(--t) var(--ease); }
.ring__label { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.wday[aria-pressed="true"] .ring__label { color: var(--text); }
.wday.is-complete .ring__label { color: var(--accent); }
.wday__num { font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.wday.is-today .wday__num { color: var(--accent); font-weight: 600; }

.tasks__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); flex: none; }
.task, .composer { display: flex; align-items: center; gap: var(--s1); min-height: 40px; padding: 0 var(--s1) 0 0; border-radius: var(--r-sm); transition: background var(--t-fast) var(--ease); }
.task:hover { background: var(--hover); }
.task__text {
  flex: 1; min-width: 0; padding: 6px var(--s2); border-radius: var(--r-sm);
  text-align: left; cursor: text; overflow-wrap: anywhere;
  transition: color var(--t) var(--ease);
}
.task.is-done .task__text { color: var(--text-3); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, 0.25); }
.task .input--inline { flex: 1; margin-right: var(--s1); }
.task__date { flex: none; }
.task .icon-btn { opacity: 0; transition: opacity var(--t-fast) var(--ease), background var(--t-fast), color var(--t-fast); }
.task:hover .icon-btn, .task:focus-within .icon-btn { opacity: 1; }
@media (hover: none) { .task .icon-btn { opacity: 1; } }
.composer { margin-bottom: var(--s1); flex: none; }
.composer .check { border-style: dashed; cursor: default; }
.composer .input--inline { flex: 1; }

/* ---------- 7. Overlays ---------- */
.dialog {
  padding: 0; margin: auto;
  width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  border-radius: var(--r-panel); border: 1px solid var(--border-strong);
  background: var(--surface-raised); color: var(--text);
  box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  backdrop-filter: blur(28px) saturate(140%);
  overflow: hidden;
}
.dialog[open] { display: flex; flex-direction: column; animation: dialog-in var(--t-slow) var(--ease); }
.dialog::backdrop { background: rgba(6, 7, 9, 0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade-in var(--t-slow) var(--ease); }
.dialog.is-closing { animation: dialog-out 140ms var(--ease) forwards; }
.dialog.is-closing::backdrop { animation: fade-out 140ms var(--ease) forwards; }
.dialog--wide { width: min(520px, calc(100vw - 32px)); }
.dialog--top { margin-top: min(14vh, 120px); }
.dialog__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s4) 0 var(--s5); }
.dialog__title { font-size: var(--fs-md); font-weight: 600; }
.dialog__body { padding: var(--s4) var(--s5); overflow-y: auto; color: var(--text-2); }
.dialog__foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s5) var(--s5); border-top: 1px solid var(--border); }
.dialog__foot .spacer { flex: 1; }
.dialog__hint { font-size: var(--fs-xs); color: var(--text-3); display: flex; align-items: center; gap: 4px; }

.settings { display: flex; flex-direction: column; gap: var(--s6); }
.settings__group { display: flex; flex-direction: column; gap: var(--s3); }
.settings__row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: var(--ctl-h); color: var(--text); }
.settings__row .input { max-width: 220px; }
.swatches { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.swatch:hover { transform: scale(1.1); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface-raised), 0 0 0 3.5px var(--c); }
.swatch--custom { position: relative; overflow: hidden; background: conic-gradient(#ef7a7a, #e6c26b, #7fd1a4, #6fb7f0, #a78bfa, #ef7a7a); }
.swatch--custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
.shortcuts { display: grid; grid-template-columns: 1fr auto; gap: var(--s2) var(--s4); font-size: var(--fs-sm); color: var(--text); }
.shortcuts dd { margin: 0; display: flex; gap: 4px; justify-content: flex-end; }
.note { font-size: var(--fs-sm); color: var(--text-3); }
.confirm__detail { margin-top: var(--s3); font-size: var(--fs-sm); color: var(--text-3); }

.toasts {
  position: fixed; inset: auto auto var(--s6) 50%; transform: translateX(-50%);
  margin: 0; padding: 0; border: 0; background: none; overflow: visible;
  display: flex; flex-direction: column-reverse; align-items: center; gap: var(--s2);
  z-index: 100; pointer-events: none; width: max-content; max-width: calc(100vw - 32px);
}
.toast {
  display: flex; align-items: center; gap: var(--s3);
  padding: 9px var(--s2) 9px var(--s4); min-height: 40px;
  border-radius: var(--r-ctl);
  background: rgba(28, 30, 35, 0.92); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
  font-size: var(--fs-sm); color: var(--text);
  pointer-events: auto;
  animation: toast-in var(--t-slow) var(--ease);
}
.toast.is-leaving { animation: toast-out var(--t) var(--ease) forwards; }
.toast__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.toast--error .toast__dot { background: var(--danger); }
.toast__msg { padding-right: var(--s2); }
.toast .btn { height: 26px; padding: 0 var(--s2); color: var(--accent); }

.dropzone {
  position: fixed; inset: var(--s3); z-index: 90;
  display: grid; place-items: center;
  border-radius: var(--r-panel); border: 1.5px dashed var(--accent-line);
  background: rgba(14, 15, 18, 0.72);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  pointer-events: none;
  animation: fade-in var(--t) var(--ease);
}
.dropzone__inner { display: flex; flex-direction: column; align-items: center; gap: var(--s2); text-align: center; }
.dropzone__inner .icon { width: 28px; height: 28px; color: var(--accent); }
.dropzone__title { font-size: var(--fs-md); font-weight: 600; }
.dropzone__text { color: var(--text-2); font-size: var(--fs-sm); }

/* ---------- 8. Responsive ---------- */
@media (max-width: 1099px) {
  :root { --gutter: var(--s5); }
}
/* Tablet (portrait or narrow): clock + calendar side by side, tasks across
   the full width. Landscape tablets keep the three-column desktop layout. */
@media (max-width: 1099px) and (orientation: portrait), (max-width: 899px) {
  .dashboard { grid-template-rows: none; min-height: 0; flex: none; }
  .panel--tasks { grid-column: 1 / -1; }
  .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .list { max-height: 320px; }
  .panel--tasks .list { max-height: 420px; }
  .clock__face { flex-basis: 230px; }
}
/* Phone: one column; section navigation becomes a bottom tab bar. */
@media (max-width: 719px) {
  :root { --gutter: var(--s4); --fs-display: 40px; --fs-xl: 22px; }
  .topbar { margin-top: var(--s2); top: var(--s2); padding: 0 var(--s2) 0 var(--s4); }
  .topbar > .divider { display: none; }
  .nav {
    position: fixed; z-index: 30; left: var(--s3); right: var(--s3);
    bottom: calc(var(--s3) + env(safe-area-inset-bottom));
    height: 62px; padding: 0 var(--s1);
    display: grid; grid-template-columns: repeat(5, 1fr);
    border-radius: var(--r-panel);
    background: rgba(26, 28, 33, 0.82); border: 1px solid var(--border-strong); box-shadow: var(--shadow-pop);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%); backdrop-filter: blur(var(--blur)) saturate(140%);
  }
  .nav__btn { width: auto; height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .nav__btn[aria-current="page"] { background: transparent; }
  .nav__btn[aria-current="page"] .nav__label { color: var(--text); }
  .nav__label { display: block; font-size: 10.5px; font-weight: 500; }
  .nav__btn::after { display: none; }
  .main { padding: var(--s5) var(--gutter) calc(96px + env(safe-area-inset-bottom)); }
  .dashboard { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .panel { padding: var(--s4); }
  .panel--clock .clock { gap: var(--s4); padding: var(--s2) 0; }
  .clock__face { flex: none; height: min(62vw, 220px); }
  .list { max-height: none; overflow: visible; }
  .panel--tasks .list { max-height: none; }
  .page-head { margin-bottom: var(--s5); }
  .input { font-size: var(--fs-md); } /* stops iOS zooming on focus */
  .toasts { bottom: calc(96px + env(safe-area-inset-bottom)); }
  .dialog--top { margin-top: var(--s10); }
  .dialog__hint { display: none; } /* keyboard hint is noise on touch screens */
  .settings__row .input { max-width: 180px; }
}
/* Home fits the window exactly: no page scroll; long lists scroll inside
   their panels. Phones (and very short windows) keep normal scrolling. */
@media (min-width: 1100px) and (min-height: 640px),
       (min-width: 900px) and (orientation: landscape) and (min-height: 640px),
       (min-width: 720px) and (min-height: 960px) {
  .app[data-page="home"] { height: 100dvh; overflow: hidden; }
  .app[data-page="home"] .main { min-height: 0; padding-top: var(--s5); padding-bottom: var(--s5); }
  .app[data-page="home"] .dashboard { flex: 1; min-height: 0; }
  .app[data-page="home"] .list {
    max-height: none; padding-bottom: var(--s3);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--s4)), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - var(--s4)), transparent);
  }
}
/* Two-row tablet layout, fitted: the calendar row gets the larger share. */
@media (min-width: 720px) and (max-width: 1099px) and (orientation: portrait) and (min-height: 960px),
       (min-width: 720px) and (max-width: 899px) and (min-height: 960px) {
  .app[data-page="home"] .dashboard { grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr); }
}

/* ---------- 9. Motion ---------- */
@keyframes page-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(6px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes dialog-out { to { opacity: 0; transform: translateY(4px) scale(0.99); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}
</style>
</head>

<div class="ambient" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand" aria-label="STILL"><svg class="icon brand__mark"><use href="#i-mark"/></svg><span aria-hidden="true">STILL</span></div>
    <span class="divider" aria-hidden="true"></span>
    <nav class="nav" id="nav" aria-label="Sections">
      <button class="icon-btn nav__btn" type="button" data-page="home" data-tip="Home" aria-label="Home"><svg class="icon"><use href="#i-home"/></svg><span class="nav__label" aria-hidden="true">Home</span></button>
      <button class="icon-btn nav__btn" type="button" data-page="notes" data-tip="Notes" aria-label="Notes"><svg class="icon"><use href="#i-notes"/></svg><span class="nav__label" aria-hidden="true">Notes</span></button>
      <button class="icon-btn nav__btn" type="button" data-page="files" data-tip="Files" aria-label="Files"><svg class="icon"><use href="#i-files"/></svg><span class="nav__label" aria-hidden="true">Files</span></button>
      <button class="icon-btn nav__btn" type="button" data-page="connections" data-tip="Connections" aria-label="Connections"><svg class="icon"><use href="#i-connections"/></svg><span class="nav__label" aria-hidden="true">Connections</span></button>
      <button class="icon-btn nav__btn" type="button" data-page="pins" data-tip="Pin Board" aria-label="Pin Board"><svg class="icon"><use href="#i-pin"/></svg><span class="nav__label" aria-hidden="true">Pins</span></button>
    </nav>
    <div class="actions">
      <button class="icon-btn" type="button" id="btn-save" data-action="save" aria-label="Save backup"><svg class="icon"><use href="#i-save"/></svg></button>
      <button class="icon-btn" type="button" id="btn-load" data-action="load" data-tip="Load backup" aria-label="Load backup"><svg class="icon"><use href="#i-load"/></svg></button>
      <span class="divider" aria-hidden="true"></span>
      <button class="icon-btn" type="button" id="btn-capture" data-action="capture" aria-label="Quick capture" aria-keyshortcuts="Control+K Meta+K"><svg class="icon"><use href="#i-capture"/></svg></button>
      <button class="icon-btn" type="button" id="btn-settings" data-action="settings" data-tip="Settings" data-tip-align="end" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <main class="main" id="main">
    <!-- Home -->
    <section class="page" data-page="home" aria-labelledby="home-title">
      <h1 class="sr-only" id="home-title">Home</h1>
      <div class="dashboard">
        <!-- Clock -->
        <article class="panel glass panel--clock" aria-labelledby="clock-title">
          <header class="panel__head">
            <h2 class="panel__title" id="clock-title">Clock</h2>
            <span class="panel__meta" id="clock-zone"></span>
          </header>
          <div class="clock">
            <div class="clock__face">
              <svg viewBox="0 0 200 200" role="img" aria-label="Analog clock">
                <circle class="clock__rim" cx="100" cy="100" r="97"/>
                <g id="clock-ticks"></g>
                <line class="clock__hand clock__hand--hour" id="hand-hour" x1="100" y1="108" x2="100" y2="52"/>
                <line class="clock__hand clock__hand--minute" id="hand-minute" x1="100" y1="112" x2="100" y2="28"/>
                <line class="clock__hand clock__hand--second" id="hand-second" x1="100" y1="120" x2="100" y2="20"/>
                <circle class="clock__pin" cx="100" cy="100" r="3.6"/>
                <circle class="clock__pin-core" cx="100" cy="100" r="1.3"/>
              </svg>
            </div>
            <div class="clock__readout">
              <div class="clock__digital" aria-live="off"><time id="clock-time">--:--</time><span class="clock__ampm" id="clock-ampm"></span></div>
              <div class="clock__location" id="clock-location"></div>
            </div>
          </div>
        </article>

        <!-- Calendar -->
        <article class="panel glass panel--calendar" aria-labelledby="cal-title">
          <header class="panel__head">
            <h2 class="panel__title" id="cal-title">Calendar</h2>
            <button class="btn btn--ghost btn--sm" type="button" data-action="cal-today">Today</button>
          </header>
          <div class="cal__now">
            <div class="cal__weekday" id="cal-weekday"></div>
            <div class="cal__date" id="cal-date"></div>
          </div>
          <div class="cal__bar">
            <button class="icon-btn icon-btn--sm" type="button" data-action="cal-prev" aria-label="Previous month"><svg class="icon"><use href="#i-left"/></svg></button>

<script>
'use strict';
/* =====================================================================
   STILL — application script

   Architecture (one file today, modules tomorrow):
     Utilities → Dates → Model (schema, normalisation) → Store (single
     source of truth) → Items / Settings / UI actions → Persistence
     (localStorage adapter) → Backup (versioned JSON) → Search →
     UI services (icons, dialogs, toasts) → Features (clock, calendar,
     tasks, capture, settings, inbox, placeholder pages) → Navigation →
     Keyboard → Drag & drop → Render loop → Init.

   Data flow is one-way: user input calls an action, the action mutates
   the store, the store notifies, and the render loop redraws once per
   frame while persistence writes on a short debounce. Views never keep
   their own copy of data.
   ===================================================================== */
(() => {

/* ---------- Shared utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const nowISO = () => new Date().toISOString();
const clone = (v) => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function uid() {
  if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const r = crypto.getRandomValues(new Uint32Array(4));
  return Array.from(r, (n) => n.toString(16).padStart(8, '0')).join('-');
}

/** Small element builder. Props: class, text, dataset, value, checked, on* handlers, anything else → attribute. */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [key, val] of Object.entries(props)) {
      if (val == null || val === false) continue;
      if (key === 'class') el.className = val;
      else if (key === 'text') el.textContent = val;
      else if (key === 'dataset') Object.assign(el.dataset, val);
      else if (key === 'value' || key === 'checked') el[key] = val;
      else if (key.startsWith('on') && typeof val === 'function') el.addEventListener(key.slice(2), val);
      else el.setAttribute(key, val === true ? '' : val);

}
function appendChildren(el, children) {

function svg(tag, attrs = {}) {
