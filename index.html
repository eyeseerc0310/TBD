    if (!text || !it) { area.focus(); return; }
    const previous = it.content;
    const capture = Items.create('capture', { title: '', content: text, meta: { kind: 'text', category: 'Note', inbox: true, source: 'quick-notes' } });
    Items.update(it.id, { content: '' });
    area.value = '';
    updateButton();
    Toast.show('Added to Notes', {
      action: {
        label: 'Undo',
        run: () => {
          Items.remove(capture.id);
          const n = item();
          if (n) Items.update(n.id, { content: previous });
          sync(true);
        },
      },
    });
  }
  area.addEventListener('input', () => { dirty = true; updateButton(); clearTimeout(timer); timer = setTimeout(flush, 500); });
  area.addEventListener('blur', flush);
  sendBtn.addEventListener('click', sendToNotes);
  Persistence.onFlush(flush);
  return { render: () => sync(false), sync, flush };
})();

/* ---------- Calendar ---------- */
const Calendar = (() => {
  const grid = $('#cal-grid');
  const dowRow = $('#cal-dow');
  const panel = $('.panel--calendar');
  const cells = [];
  let focusDay = null;

  function build() {
    for (let i = 0; i < 7; i++) dowRow.append(h('div', { class: 'cal__dow' }));
    for (let i = 0; i < 42; i++) {
      const dots = h('span', { class: 'cal__dots', 'aria-hidden': 'true' });
      const num = h('span');
      const btn = h('button', { class: 'cal__day', type: 'button' }, num, dots);
      cells.push({ btn, num, dots });
      grid.append(btn);
    }
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.cal__day');
      if (btn) select(btn.dataset.day);
    });
    grid.addEventListener('keydown', onKey);
  }
  function select(day, { focus = false } = {}) {
    if (!Dates.isKey(day)) return;
    if (focus) focusDay = day;
    UI.set({ calDay: day, calMonth: Dates.month(day) });
  }
  function onKey(e) {
    const btn = e.target.closest('.cal__day');
    if (!btn) return;
    const day = btn.dataset.day;
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
    let next = null;
    if (e.key in moves) next = Dates.addDays(day, moves[e.key]);
    else if (e.key === 'PageUp') next = Dates.addMonths(Dates.month(day), -1) + day.slice(7);
    else if (e.key === 'PageDown') next = Dates.addMonths(Dates.month(day), 1) + day.slice(7);
    else if (e.key === 'Home') next = Dates.startOfWeek(day, Settings.get().weekStart);
    else if (e.key === 'End') next = Dates.addDays(Dates.startOfWeek(day, Settings.get().weekStart), 6);
    if (!next) return;
    e.preventDefault();
    if (!Dates.isKey(next)) { // e.g. 31 → a 30-day month: clamp to the month's last day
      const m = next.slice(0, 7);
      const last = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
      next = `${m}-${pad2(last)}`;
    }
    select(next, { focus: true });
  }

  function render() {
    const { calMonth, calDay } = UI.get();
    const { weekStart, highlightWeekends } = Settings.get();
    const today = Dates.today();

    panel.classList.toggle('cal--weekends', highlightWeekends);
    // "Today" lights up whenever you've moved away from today.
    $('[data-action="cal-today"]').classList.toggle('is-away', calDay !== today || calMonth !== Dates.month(today));
    $('#cal-month').textContent = Fmt.monthYear(calMonth);
    dowRow.childNodes.forEach((el, i) => {
      const d = (weekStart + i) % 7;
      el.textContent = Fmt.dowShort(d).slice(0, 2);
      el.title = Fmt.dowShort(d);
      el.classList.toggle('is-weekend', d === 0 || d === 6);
    });

    const first = `${calMonth}-01`;
    const start = Dates.startOfWeek(first, weekStart);
    const end = Dates.addDays(start, 41);
    const counts = Events.countRange(start, end);
    const tabbable = calDay >= start && calDay <= end && Dates.month(calDay) === calMonth ? calDay : first;

    cells.forEach((c, i) => {
      const day = Dates.addDays(start, i);
      const n = counts.get(day) || 0;
      const wd = Dates.weekday(day);
      c.btn.dataset.day = day;
      c.btn.className = `cal__day${Dates.month(day) !== calMonth ? ' is-outside' : ''}${day === today ? ' is-today' : ''}${wd === 0 || wd === 6 ? ' is-weekend' : ''}`;
      c.btn.setAttribute('aria-pressed', String(day === calDay));
      c.btn.tabIndex = day === tabbable ? 0 : -1;
      c.btn.setAttribute('aria-label', `${Fmt.dayMonth(day)}${day === today ? ', today' : ''}${n ? `, ${pluralise(n, 'event')}` : ''}`);
      if (day === today) c.btn.setAttribute('aria-current', 'date'); else c.btn.removeAttribute('aria-current');
      c.num.textContent = String(+day.slice(8));
      if (c.dots.childElementCount !== Math.min(n, 3)) {
        c.dots.replaceChildren(...Array.from({ length: Math.min(n, 3) }, () => h('span', { class: 'cal__dot' })));
      }
    });
    if (focusDay) {
      const target = cells.find((c) => c.btn.dataset.day === focusDay);
      if (target) target.btn.focus();
      focusDay = null;
    }
    renderAgenda(calDay, today);
  }
  function renderAgenda(day, today) {
    $('#agenda-title').textContent = day === today ? 'Today' : Fmt.shortDay(day);
    const list = $('#agenda-list');
    const events = Events.on(day);
    if (!events.length) {
      list.replaceChildren(h('li', { class: 'empty' }, icon('calendar'), day === today ? 'Nothing scheduled today.' : 'Nothing scheduled.'));
      return;
    }
    list.replaceChildren(...events.map((ev) => h('li', null,
      h('button', { class: 'event', type: 'button', dataset: { action: 'event-edit', id: ev.id }, 'aria-label': `Edit ${ev.title}` },
        h('span', { class: 'event__bar', 'aria-hidden': 'true' }),
        h('span', { class: 'event__body' },
          h('span', { class: 'event__title', text: ev.title }),
          h('span', { class: 'event__time', text: Events.label(ev, day) }))))));
  }
  function shiftMonth(n) { UI.set({ calMonth: Dates.addMonths(UI.get().calMonth, n) }); }
  function goToday() { const t = Dates.today(); UI.set({ calDay: t, calMonth: Dates.month(t) }); }
  return { build, render, shiftMonth, goToday };
})();

/* ---------- Event editor ---------- */
const EventEditor = (() => {
  function defaultTimes(day) {
    if (day !== Dates.today()) return ['09:00', '10:00'];
    const now = new Date();
    const startMin = Math.min((now.getHours() + 1) * 60, 22 * 60);
    return [Dates.fromMinutes(startMin), Dates.fromMinutes(startMin + 60)];
  }
  function open(eventId = null) {
    const existing = eventId ? Items.get(eventId) : null;
    const day = UI.get().calDay;
    const [t1, t2] = defaultTimes(day);
    const m = existing ? existing.meta : { start: day, end: day, startTime: t1, endTime: t2, allDay: false };

    const title = h('input', { class: 'input', type: 'text', value: existing ? existing.title : '', placeholder: 'Event title', 'aria-label': 'Title', maxlength: 200, autocomplete: 'off' });
    const allDay = h('input', { type: 'checkbox', checked: m.allDay });
    const startDate = h('input', { class: 'input', type: 'date', value: m.start, 'aria-label': 'Start date', required: true });
    const startTime = h('input', { class: 'input', type: 'time', value: m.startTime || t1, 'aria-label': 'Start time' });
    const endDate = h('input', { class: 'input', type: 'date', value: m.end, 'aria-label': 'End date', required: true });
    const endTime = h('input', { class: 'input', type: 'time', value: m.endTime || t2, 'aria-label': 'End time' });
    const error = h('p', { class: 'form-error', role: 'alert' });

    const syncAllDay = () => { startTime.hidden = endTime.hidden = allDay.checked; };
    syncAllDay();
    allDay.addEventListener('change', syncAllDay);
    // Keep the end after the start when the start moves forward.
    const startStamp = () => `${startDate.value}T${allDay.checked ? '00:00' : startTime.value}`;
    const endStamp = () => `${endDate.value}T${allDay.checked ? '00:00' : endTime.value}`;
    let lastStart = { date: startDate.value, time: startTime.value };
    const onStartChange = () => {
      if (Dates.isKey(startDate.value) && Dates.isKey(lastStart.date) && Dates.isKey(endDate.value)) {
        const shift = (Dates.parse(startDate.value) - Dates.parse(lastStart.date)) / 864e5;
        if (shift) endDate.value = Dates.addDays(endDate.value, Math.round(shift));
      }
      if (startDate.value === endDate.value && Dates.isTime(startTime.value) && Dates.isTime(lastStart.time) && Dates.isTime(endTime.value)) {
        const delta = Dates.minutes(startTime.value) - Dates.minutes(lastStart.time);
        endTime.value = Dates.fromMinutes(Dates.minutes(endTime.value) + delta);
      }
      lastStart = { date: startDate.value, time: startTime.value };
    };
    startDate.addEventListener('change', onStartChange);
    startTime.addEventListener('change', onStartChange);

    const body = h('div', { class: 'form' },
      h('label', { class: 'field' }, h('span', { class: 'field__label', text: 'Title' }), title),
      h('label', { class: 'switch' }, allDay, 'All day'),
      h('div', { class: 'field' }, h('span', { class: 'field__label', text: 'Starts' }), h('div', { class: 'field-row' }, startDate, startTime)),
      h('div', { class: 'field' }, h('span', { class: 'field__label', text: 'Ends' }), h('div', { class: 'field-row' }, endDate, endTime)),
      error);

    function save(close) {
      const name = title.value.trim();
      title.setAttribute('aria-invalid', String(!name));
      if (!name) { error.textContent = 'Give the event a title.'; title.focus(); return; }
      if (!Dates.isKey(startDate.value) || !Dates.isKey(endDate.value)) { error.textContent = 'Choose a start and end date.'; return; }
      if (!allDay.checked && (!Dates.isTime(startTime.value) || !Dates.isTime(endTime.value))) { error.textContent = 'Choose a start and end time.'; return; }
      if (endStamp() < startStamp()) { error.textContent = 'The event can’t end before it starts.'; return; }
      const meta = {
        start: startDate.value, end: endDate.value, allDay: allDay.checked,
        startTime: allDay.checked ? null : startTime.value, endTime: allDay.checked ? null : endTime.value,
      };
      if (existing) Items.update(existing.id, { title: name, meta });
      else Items.create('event', { title: name, meta });
      UI.set({ calDay: meta.start, calMonth: Dates.month(meta.start) });
      Toast.show(existing ? 'Event updated' : 'Event added');
      close();
    }

    const actions = [];
    if (existing) actions.push({ label: 'Delete', variant: 'danger', run: (close) => { close(); removeWithUndo(existing.id, 'Event'); } });
    actions.push('spacer', { label: 'Cancel' }, { label: existing ? 'Save' : 'Add event', variant: 'primary', submit: true });
    Dialog.open({ title: existing ? 'Edit event' : 'New event', body, actions, dismissOnBackdrop: false, initialFocus: title, onSubmit: save });
  }
  return { open };
})();

/* ---------- Tasks panel ----------
   Each task is its own card: drag handle (on hover), checkbox, text
   (click to edit) and a ⋯ menu with edit, colour, move and delete.
   Order lives in meta.order; colour in meta.color. */
const TaskPanel = (() => {
  const RING_C = 2 * Math.PI * 15.5;
  const list = $('#task-list');
  const search = $('#task-search');
  const weekRow = $('#week-days');
  const days = [];
  let composer = null;    // the inline "new task" row while it's open
  let editing = null;     // id of the task being edited inline (pauses list redraws)
  let dragging = false;   // a drag is in progress (pauses list redraws)
  let focusAfter = null;  // selector to focus after the next list redraw

  const rowSel = (id) => `.task[data-id="${CSS.escape(id)}"]`;

  function build() {
    for (let i = 0; i < 7; i++) {
      const fill = svg('circle', { class: 'ring__fill', cx: 18, cy: 18, r: 15.5, 'stroke-dasharray': `0 ${RING_C}` });
      const ringSvg = svg('svg', { viewBox: '0 0 36 36', 'aria-hidden': 'true' });
      ringSvg.append(svg('circle', { class: 'ring__track', cx: 18, cy: 18, r: 15.5 }), fill);
      const label = h('span', { class: 'ring__label', 'aria-hidden': 'true' });
      const num = h('span', { class: 'wday__num', 'aria-hidden': 'true' });
      const btn = h('button', { class: 'wday', type: 'button' }, h('span', { class: 'ring' }, ringSvg, label), num);
      days.push({ btn, fill, label, num });
      weekRow.append(btn);
    }
    weekRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.wday');
      if (btn) UI.set({ taskDay: btn.dataset.day });
    });
    search.addEventListener('input', render);
    search.addEventListener('keydown', (e) => { if (e.key === 'Escape' && search.value) { e.stopPropagation(); search.value = ''; render(); } });

    list.addEventListener('change', (e) => {
      const box = e.target.closest('.check');
      const row = box && box.closest('.task');
      if (row) Items.update(row.dataset.id, { meta: { done: box.checked } });
    });
    list.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      const row = el && el.closest('.task');
      if (!row) return;
      if (el.dataset.action === 'task-edit') beginEdit(row.dataset.id);
      else if (el.dataset.action === 'task-menu') openMenu(row.dataset.id, el);
    });
    list.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.task__handle');
      if (handle && e.button === 0) startDrag(e, handle);
    });
  }

  /* --- Creating --- */
  function openComposer() {
    if (search.value) search.value = '';
    if (!composer) {
      const input = h('input', { class: 'input input--inline', type: 'text', placeholder: 'New task — press Enter to add', 'aria-label': 'New task', maxlength: 500, autocomplete: 'off' });
      const form = h('form', { style: 'display:contents' }, h('span', { class: 'check-hit', 'aria-hidden': 'true' }, h('span', { class: 'check' })), input);
      composer = h('li', { class: 'composer' }, form);
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = input.value.trim();
        if (!title) return;
        const day = UI.get().taskDay;
        Items.create('task', { title, meta: { date: day, done: false, order: Tasks.nextOrder(day), color: null } });
        input.value = '';
      });
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeComposer(); } });
      input.addEventListener('blur', () => { if (!input.value.trim()) closeComposer(false); });
    }
    render();
    $('input', composer).focus();
  }
  function closeComposer(refocus = true) {
    if (!composer) return;
    const c = composer;
    composer = null;
    c.remove();
    render();
    if (refocus) $('[data-action="task-new"]').focus();
  }

  /* --- Editing --- */
  function beginEdit(id) {
    const item = Items.get(id);
    const row = list.querySelector(rowSel(id));
    if (!item || !row) return;
    editing = id;
    const input = h('input', { class: 'input input--inline', type: 'text', value: item.title, maxlength: 500, 'aria-label': 'Edit task' });
    $('.task__text', row).replaceWith(input);
    input.focus();
    input.select();
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      editing = null;
      focusAfter = `${rowSel(id)} .task__text`;
      const value = input.value.trim();
      // An empty edit reverts rather than deleting: deletion is always explicit.
      if (save && value && value !== item.title) Items.update(id, { title: value });
      else render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  /* --- ⋯ menu --- */
  function openMenu(id, anchor) {
    const task = Items.get(id);
    if (!task) return;
    const searching = !!search.value.trim();
    const dayIds = Tasks.on(task.meta.date).map((t) => t.id);
    const index = dayIds.indexOf(id);
    const item = (iconName, label, run, { danger = false, disabled = false } = {}) => h('button', {
      class: `menu__item${danger ? ' menu__item--danger' : ''}`, type: 'button', role: 'menuitem', disabled,
      onclick: run,
    }, icon(iconName), label);
    const move = (delta) => () => {
      Popover.close(false);
      if (Tasks.move(id, delta)) focusAfter = `${rowSel(id)} .task__more`;
    };
    const content = [
      item('edit', 'Edit', () => { Popover.close(false); beginEdit(id); }),
      h('div', { class: 'menu__sep', role: 'separator' }),
      h('div', { class: 'menu__group' },
        h('div', { class: 'panel__title menu__label', text: 'Colour' }),
        swatchPicker({ value: task.meta.color, allowNone: true, label: 'Task colour', onPick: (c) => Items.update(id, { meta: { color: c } }) })),
      h('div', { class: 'menu__sep', role: 'separator' }),
      item('arrow-up', 'Move up', move(-1), { disabled: searching || index <= 0 }),
      item('arrow-down', 'Move down', move(1), { disabled: searching || index < 0 || index >= dayIds.length - 1 }),
      h('div', { class: 'menu__sep', role: 'separator' }),
      item('trash', 'Delete', () => {
        Popover.close(false);
        const row = list.querySelector(rowSel(id));
        const next = row && (row.nextElementSibling || row.previousElementSibling);
        if (next && next.dataset.id) focusAfter = `${rowSel(next.dataset.id)} .task__text`;
        removeWithUndo(id, 'Task');
      }, { danger: true }),
    ];
    Popover.open({
      anchor, key: `task:${id}`, content, label: `Options for “${task.title}”`,
      getAnchor: () => list.querySelector(`${rowSel(id)} .task__more`),
    });
  }

  /* --- Drag to reorder (pointer events: mouse, pen and touch) --- */
  function startDrag(e, handle) {
    const row = handle.closest('.task');
    if (!row || editing || search.value.trim()) return;
    e.preventDefault();
    Popover.close(false);
    const rows = $$('.task', list);
    const from = rows.indexOf(row);
    if (from < 0) return;
    const rects = rows.map((r) => r.getBoundingClientRect());
    const gap = rows.length > 1 ? rects[1].top - rects[0].bottom : 6;
    const shiftBy = rects[from].height + gap;
    const minDy = rects[0].top - rects[from].top;
    const maxDy = rects[rects.length - 1].bottom - rects[from].bottom;
    const startY = e.clientY;
    let to = from;
    dragging = true;
    row.classList.add('is-dragging');
    document.documentElement.classList.add('is-dragging');
    try { handle.setPointerCapture(e.pointerId); } catch { /* ignore */ }

    const onMove = (ev) => {
      const dy = Math.max(minDy, Math.min(maxDy, ev.clientY - startY));
      row.style.transform = `translateY(${dy}px)`;
      const mid = rects[from].top + rects[from].height / 2 + dy;
      to = from;
      // Passing a row's midpoint (or reaching it at the list's edge) takes its place.
      for (let i = from + 1; i < rows.length; i++) if (mid >= rects[i].top + rects[i].height / 2) to = i;
      for (let i = from - 1; i >= 0; i--) if (mid <= rects[i].top + rects[i].height / 2) to = i;
      rows.forEach((r, i) => {
        if (i === from) return;
        const s = i > from && i <= to ? -shiftBy : i < from && i >= to ? shiftBy : 0;
        r.style.transform = s ? `translateY(${s}px)` : '';
      });
    };
    const onEnd = () => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      document.documentElement.classList.remove('is-dragging');
      dragging = false;
      if (to !== from) {
        const ids = rows.map((r) => r.dataset.id);
        const [moved] = ids.splice(from, 1);
        ids.splice(to, 0, moved);
        Tasks.reorder(ids); // redraw replaces the rows, clearing the transforms
      } else {
        rows.forEach((r) => { r.style.transform = ''; });
        row.classList.remove('is-dragging');
      }
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
  }

  /* --- Rendering --- */
  function taskRow(task, { searching = false } = {}) {
    const { done, color } = task.meta;
    const menuOpen = Popover.isOpenFor(`task:${task.id}`);
    return h('li', {
      class: `task${done ? ' is-done' : ''}${color ? ' has-color' : ''}`,
      dataset: { id: task.id },
      style: color ? `--task-c:${color}` : null,
    },
      searching ? null : h('button', { class: 'task__handle', type: 'button', tabindex: '-1', 'aria-hidden': 'true', title: 'Drag to reorder' }, icon('grip')),
      h('label', { class: 'check-hit' }, h('input', { class: 'check', type: 'checkbox', checked: done, 'aria-label': `Complete “${task.title}”` })),
      h('button', { class: 'task__text', type: 'button', dataset: { action: 'task-edit' }, text: task.title, 'aria-label': `Edit “${task.title}”` }),
      searching ? h('span', { class: 'tag task__date', text: Fmt.shortDate(task.meta.date) }) : null,
      h('button', {
        class: 'icon-btn icon-btn--sm task__more', type: 'button', dataset: { action: 'task-menu' },
        'aria-label': `More options for “${task.title}”`, 'aria-haspopup': 'menu', 'aria-expanded': String(menuOpen),
      }, icon('more')));
  }

  function renderWeek(taskDay, today, weekStart) {
    const start = Dates.startOfWeek(taskDay, weekStart);
    days.forEach((d, i) => {
      const day = Dates.addDays(start, i);
      const { total, done } = Tasks.progress(day);
      const ratio = total ? done / total : 0;
      d.btn.dataset.day = day;
      d.btn.setAttribute('aria-pressed', String(day === taskDay));
      d.btn.setAttribute('aria-label', `${Fmt.dayMonth(day)}: ${total ? `${done} of ${total} tasks done` : 'no tasks'}`);
      d.btn.classList.toggle('is-today', day === today);
      d.btn.classList.toggle('is-complete', total > 0 && done === total);
      d.fill.setAttribute('stroke-dasharray', `${(ratio * RING_C).toFixed(2)} ${RING_C.toFixed(2)}`);
      d.fill.style.opacity = ratio ? '1' : '0';
      d.label.textContent = Fmt.dowNarrow(Dates.weekday(day));
      d.num.textContent = String(+day.slice(8));
    });
  }

  function render() {
    const { taskDay } = UI.get();
    const today = Dates.today();
    renderWeek(taskDay, today, Settings.get().weekStart);
    if (editing || dragging) return; // don't pull the list out from under the user

    const q = search.value.trim();
    let rows; let emptyText;
    if (q) {
      const found = Search.query(q, { types: ['task'] })
        .sort((a, b) => a.meta.date.localeCompare(b.meta.date) || (a.meta.order - b.meta.order));
      $('#tasks-day').textContent = 'Search results';
      $('#tasks-count').textContent = pluralise(found.length, 'match', 'matches');
      rows = found.map((t) => taskRow(t, { searching: true }));
      emptyText = `No tasks match “${q}”.`;
    } else {
      const tasks = Tasks.on(taskDay);
      const done = tasks.filter((t) => t.meta.done).length;
      $('#tasks-day').textContent = taskDay === today ? 'Today’s tasks' : `Tasks for ${Fmt.dayMonth(taskDay)}`;
      $('#tasks-count').textContent = tasks.length ? `${done} of ${tasks.length} done` : '';
      rows = tasks.map((t) => taskRow(t));
      emptyText = 'Your tasks are clear.';
    }
    list.classList.toggle('is-searching', !!q);
    // The composer row stays in place across redraws so its input keeps focus.
    const keep = composer && !q ? composer : null;
    for (const child of [...list.children]) if (child !== keep) child.remove();
    if (keep && keep.parentNode !== list) list.prepend(keep);
    if (rows.length) list.append(...rows);
    else if (!keep) list.append(h('li', { class: 'empty' }, icon('check'), emptyText));
    if (focusAfter) {
      const el = list.querySelector(focusAfter);
      if (el) el.focus();
      focusAfter = null;
    }
  }
  function shiftWeek(n) { UI.set({ taskDay: Dates.addDays(UI.get().taskDay, n * 7) }); }
  return { build, render, openComposer, shiftWeek, focusSearch: () => { search.focus(); search.select(); } };
})();

/* ---------- Quick capture ----------
   Capture kinds are a registry: each kind knows how to turn its form
   fields into an item. Text is the only kind today; links, images, files,
   screenshots and voice notes add an entry here (binary payloads go to a
   blob store and the item keeps a reference in meta). */
const Capture = (() => {
  const CATEGORIES = ['Idea', 'Note', 'Reference', 'Personal'];
  const KINDS = {
    text: {
      isEmpty: (f) => !f.text.trim(),
      toItem: (f) => ({ title: f.title.trim(), content: f.text.trim(), meta: { kind: 'text', category: f.category, inbox: true } }),
    },
  };
  let draft = { kind: 'text', title: '', text: '', category: '' }; // kept in memory if the dialog is dismissed
  let current = null;

  function open() {
    if (current) { current.close(); return; }
    Popover.close(false);
    const text = h('textarea', { class: 'input', placeholder: 'What’s on your mind?', 'aria-label': 'Capture text', rows: 4, value: draft.text });
    const title = h('input', { class: 'input', type: 'text', placeholder: 'Title (optional)', 'aria-label': 'Title', maxlength: 200, value: draft.title });
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Category' },
      CATEGORIES.map((c) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.category === c), text: c, dataset: { category: c } })));
    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const on = chip.getAttribute('aria-pressed') !== 'true';
      $$('.chip', chips).forEach((c) => c.setAttribute('aria-pressed', 'false'));
      chip.setAttribute('aria-pressed', String(on));
      draft.category = on ? chip.dataset.category : '';
    });
    const read = () => ({ kind: draft.kind, title: title.value, text: text.value, category: draft.category });

    function save(close) {
      const fields = read();
      const kind = KINDS[fields.kind];
      if (kind.isEmpty(fields)) { text.focus(); text.setAttribute('aria-invalid', 'true'); return; }
      Items.create('capture', kind.toItem(fields));
      draft = { kind: 'text', title: '', text: '', category: '' };
      close('saved');
      Toast.show('Captured to Inbox', { action: UI.get().page === 'notes' ? null : { label: 'View', run: () => Navigation.go('notes') } });
    }
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(current.close); }
    });
    text.addEventListener('input', () => text.removeAttribute('aria-invalid'));

    const hint = h('span', { class: 'dialog__hint' }, h('kbd', { text: MOD }), h('kbd', { text: '↵' }), ' to save');
    current = Dialog.open({
      title: 'Quick capture',
      className: 'dialog--wide dialog--top',
      body: h('div', { class: 'form' }, text, title, chips),
      actions: [hint, 'spacer', { label: 'Cancel' }, { label: 'Save to Inbox', variant: 'primary', submit: true }],
      initialFocus: text,
      onSubmit: save,
      onClose: (result) => {
        if (result !== 'saved') { const f = read(); draft.title = f.title; draft.text = f.text; }
        current = null;
      },
    });
  }
  return { open };
})();

/* ---------- Settings ----------
   An accordion of categories. Each category is data: an icon, a title,
   a description, the settings keys it owns (for "Reset to default") and
   a function that builds its rows from the current settings. Rows carry
   search text; the search box filters rows and opens matching
   categories. Every control writes straight to the store, so changes
   preview live. */
const SettingsPanel = (() => {
  const SHORTCUTS = [
    ['Quick capture', [MOD, 'K']],
    ['Save backup', [MOD, 'S']],
    ['New task (Home) · capture (Notes)', ['N']],
    ['Search tasks', ['/']],
    ['Close dialogs and menus', ['Esc']],
    ['Move between days in the calendar', ['←', '→', '↑', '↓']],
  ];
  const FACE_LABELS = { minimal: 'Minimal', classic: 'Classic', modern: 'Modern', digital: 'Digital' };
  const SHAPE_LABELS = { circle: 'Circle', rounded: 'Rounded', squircle: 'Squircle', hexagon: 'Hexagon' };
  const CUSTOM_FIELDS = [['bg', 'Background'], ['panel', 'Panel tint'], ['line', 'Border'], ['text', 'Primary text']];
  const set = (patch) => Settings.set(patch);

  /* --- Controls --- */
  function row(label, control, { keywords = '', hint = '' } = {}) {
    return h('div', { class: 'srow', dataset: { search: `${label} ${keywords}`.toLowerCase() } },
      h('div', { class: 'srow__label' }, h('span', { text: label }), hint ? h('span', { class: 'srow__hint', text: hint }) : null),
      control);
  }
  function stackRow(label, control, { keywords = '' } = {}) {
    return h('div', { class: 'srow srow--stack', dataset: { search: `${label} ${keywords}`.toLowerCase() } },
      h('div', { class: 'srow__label' }, h('span', { text: label })), control);
  }
  function seg(key, options, value, label) {
    const group = h('div', { class: 'seg', role: 'group', 'aria-label': label },
      options.map(([val, text]) => h('button', { type: 'button', 'aria-pressed': String(val === value), text, dataset: { value: String(val), key: `${key}:${val}` } })));
    group.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('button', group).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      set({ [key]: options.find(([v]) => String(v) === b.dataset.value)[0] });
    });
    return group;
  }
  function toggle(key, value, label, { disabled = false } = {}) {
    return h('label', { class: 'switch' }, h('input', {
      type: 'checkbox', checked: value, 'aria-label': label, dataset: { key }, disabled,
      onchange: (e) => set({ [key]: e.target.checked }),
    }));
  }
  function tiles(key, options, value, label, onPick, className = '') {
    const group = h('div', { class: `tiles ${className}`.trim(), role: 'group', 'aria-label': label },
      options.map((o) => h('button', { class: 'tile', type: 'button', 'aria-pressed': String(o.id === value), dataset: { value: o.id, key: `${key}:${o.id}` } }, o.preview, h('span', { text: o.label }))));
    group.addEventListener('click', (e) => {
      const b = e.target.closest('.tile');
      if (!b) return;
      $$('.tile', group).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      onPick(b.dataset.value);
    });
    return group;
  }
  function range(key, value, min, max, label, fmt = (v) => String(v)) {
    const out = h('output', { class: 'range__value', text: fmt(value) });
    const input = h('input', { class: 'range', type: 'range', min, max, step: 1, value: String(value), 'aria-label': label, dataset: { key } });
    const paint = () => input.style.setProperty('--p', `${((input.value - min) / (max - min)) * 100}%`);
    input.addEventListener('input', () => { const v = Number(input.value); out.textContent = fmt(v); paint(); set({ [key]: v }); });
    paint();
    return h('div', { class: 'range-wrap' }, input, out);
  }
  function colorField(value, label, key, onInput) {
    const dot = h('span', { class: 'color-field__dot', style: `--c:${value}` });
    const text = h('span', { text: value.toUpperCase() });
    const input = h('input', { type: 'color', value, 'aria-label': label, dataset: { key } });
    input.addEventListener('input', () => {
      const v = input.value.toLowerCase();
      dot.style.setProperty('--c', v);
      text.textContent = v.toUpperCase();
      onInput(v);
    });
    return h('label', { class: 'color-field' }, dot, text, input);
  }
  function facePreview(face, shape) {
    const el = svg('svg', { class: 'tile__svg', viewBox: '0 0 200 200', 'aria-hidden': 'true' });
    ClockFace.draw(el, { face, shape, preview: true });
    return el;
  }
  function themePreview(id, s) {
    if (id === 'custom') return h('span', { class: 'theme-prev theme-prev--custom', 'aria-hidden': 'true' });
    const t = THEMES[id];
    return h('span', { class: 'theme-prev', 'aria-hidden': 'true', style: `--pv-bg:${t.bg};--pv-panel:${t.panel};--pv-line:${t.line}33;--pv-accent:${id === s.theme ? s.accent : t.accent}` });
  }

  /* --- Categories --- */
  const SECTIONS = [
    {
      id: 'clock', icon: 'clock', title: 'Clock', desc: 'Time format, location, face and shape',
      keys: ['clock24', 'location', 'clockFace', 'clockShape', 'showTime', 'showSeconds', 'showDate'],
      rows(s, refresh) {
        const location = h('input', { class: 'input', type: 'text', value: s.location, placeholder: Clock.autoCity(), 'aria-label': 'Location', maxlength: 80, dataset: { key: 'location' } });
        location.addEventListener('input', () => set({ location: location.value }));
        return [
          row('Time format', seg('clock24', [[false, '12-hour'], [true, '24-hour']], s.clock24, 'Time format'), { keywords: '12 24 hour am pm' }),
          row('Location', location, { keywords: 'city place time zone' }),
          stackRow('Face style', tiles('clockFace', Object.keys(FACE_LABELS).map((id) => ({ id, label: FACE_LABELS[id], preview: facePreview(id, s.clockShape) })), s.clockFace, 'Face style',
            (v) => { set({ clockFace: v }); refresh(); }), { keywords: 'minimal classic modern digital numerals analog' }),
          stackRow('Shape', tiles('clockShape', Object.keys(SHAPE_LABELS).map((id) => ({ id, label: SHAPE_LABELS[id], preview: facePreview(s.clockFace === 'digital' ? 'minimal' : s.clockFace, id) })), s.clockShape, 'Clock shape',
            (v) => { set({ clockShape: v }); refresh(); }), { keywords: 'circle rounded square squircle hexagon' }),
          row('Show digital time', toggle('showTime', s.clockFace === 'digital' ? true : s.showTime, 'Show digital time', { disabled: s.clockFace === 'digital' }),
            { keywords: 'digital time numbers bigger larger clock', hint: s.clockFace === 'digital' ? 'Always shown on the Digital face' : 'Turn off for a larger clock face' }),
          row('Show second hand', toggle('showSeconds', s.showSeconds, 'Show second hand'), { keywords: 'seconds' }),
          row('Show date under the clock', toggle('showDate', s.showDate, 'Show date under the clock'), { keywords: 'day' }),
        ];
      },
    },
    {
      id: 'calendar', icon: 'calendar', title: 'Calendar', desc: 'Week start and weekends',
      keys: ['weekStart', 'highlightWeekends'],
      rows: (s) => [
        row('Week starts on', seg('weekStart', [[1, 'Monday'], [0, 'Sunday']], s.weekStart, 'Week starts on'), { keywords: 'monday sunday first day' }),
        row('Highlight weekends', toggle('highlightWeekends', s.highlightWeekends, 'Highlight weekends'), { keywords: 'saturday sunday' }),
      ],
    },
    {
      id: 'appearance', icon: 'palette', title: 'Appearance', desc: 'Theme, accent, font, glass and density',
      keys: ['theme', 'customTheme', 'accent', 'font', 'transparency', 'blur', 'radius', 'density'],
      rows(s, refresh) {
        Object.keys(FONTS).forEach((id) => window.StillTheme.loadFont(id)); // for the "Aa" previews
        const pickTheme = (id) => {
          if (id === 'custom') set({ theme: 'custom' });
          else set({ theme: id, accent: THEMES[id].accent });
          refresh();
        };
        return [
          stackRow('Theme', tiles('theme', [...Object.keys(THEMES), 'custom'].map((id) => ({ id, label: id === 'custom' ? 'Custom' : THEMES[id].label, preview: themePreview(id, s) })), s.theme, 'Theme', pickTheme, 'tiles--themes'),
            { keywords: 'graphite midnight forest mocha light dark custom colours' }),
          s.theme === 'custom' ? CUSTOM_FIELDS.map(([k, label]) => row(label, colorField(s.customTheme[k], label, `custom:${k}`, (v) => set({ customTheme: { ...Settings.get().customTheme, [k]: v } })), { keywords: 'custom theme colour' })) : null,
          s.theme === 'custom' ? row('Accent', colorField(s.accent, 'Accent', 'custom:accent', (v) => set({ accent: v })), { keywords: 'custom theme colour' }) : null,
          row('Accent colour', swatchPicker({ value: s.accent, label: 'Accent colour', onPick: (c) => { set({ accent: c }); if (s.theme === 'custom') refresh(); } }), { keywords: 'slate mist wine sage mustard clay highlight' }),
          stackRow('Font', tiles('font', Object.keys(FONTS).map((id) => ({
            id, label: id === 'system' ? 'SF Pro / System' : id === 'mono' ? 'JetBrains Mono' : id === 'serif' ? 'Playfair Display' : 'Inter',
            preview: h('span', { class: 'tile__font', style: `font-family:${FONTS[id].head || FONTS[id].body}`, text: 'Aa' }),
          })), s.font, 'Font', (v) => set({ font: v })), { keywords: 'typeface inter system sf pro jetbrains mono playfair serif' }),
          row('Glass transparency', range('transparency', s.transparency, 0, 80, 'Glass transparency', (v) => `${v}%`), { keywords: 'opacity glass' }),
          row('Blur strength', range('blur', s.blur, 0, 40, 'Blur strength', (v) => `${v}px`), { keywords: 'frosted glass' }),
          row('Corner roundness', range('radius', s.radius, 4, 28, 'Corner roundness', (v) => `${v}px`), { keywords: 'radius rounded corners' }),
          row('Density', seg('density', [['comfortable', 'Comfortable'], ['compact', 'Compact']], s.density, 'Density'), { keywords: 'spacing compact comfortable' }),
        ];
      },
    },
    {
      id: 'shortcuts', icon: 'keyboard', title: 'Keyboard shortcuts', desc: 'Work faster from the keyboard',
      rows: () => SHORTCUTS.map(([label, keys]) => row(label, h('span', null, keys.map((k) => h('kbd', { text: k }))), { keywords: 'shortcut key' })),
    },
    {
      id: 'data', icon: 'data', title: 'Your data', desc: 'Backups and reset',
      rows: () => [
        h('div', { class: 'srow', dataset: { search: 'your data privacy local storage device' } }, h('p', { text: 'Everything stays in this browser on this device. Nothing is sent anywhere.' })),
        h('div', { class: 'srow', dataset: { search: 'save load backup reset everything export import' } },
          h('div', { class: 'btn-row' },
            h('button', { class: 'btn', type: 'button', onclick: () => Backup.download() }, icon('save', 'icon--sm'), 'Save backup'),
            h('button', { class: 'btn', type: 'button', onclick: () => $('#file-input').click() }, icon('load', 'icon--sm'), 'Load backup'),
            h('button', { class: 'btn btn--danger', type: 'button', onclick: resetEverything }, icon('reset', 'icon--sm'), 'Reset everything'))),
      ],
    },
  ];

  async function resetEverything() {
    const ok = await Dialog.confirm({
      title: 'Reset everything?',
      message: 'This deletes all tasks, events, notes and captures and restores every setting to its default.',
      detail: 'You can undo right after, and a copy is kept on this device. Save a backup first if you want one to keep.',
      confirmLabel: 'Reset everything',
      danger: true,
    });
    if (!ok) return;
    const previous = clone(Store.get());
    Persistence.keepCopy(previous, 'before-reset');
    Store.replace(defaultState(), 'reset');
    Persistence.save();
    Navigation.syncHash();
    if (api) api.refreshAll();
    Toast.show('Everything was reset', { action: { label: 'Undo', run: () => { Store.replace(previous, 'restore'); Persistence.save(); Navigation.syncHash(); if (api) api.refreshAll(); } } });
  }

  let api = null;
  function open() {
    if (api) return;
    const query = h('input', { class: 'input', type: 'search', placeholder: 'Search settings', 'aria-label': 'Search settings', autocomplete: 'off', spellcheck: 'false' });
    const searchBox = h('label', { class: 'search' }, icon('search', 'icon--sm'), query);
    const empty = h('p', { class: 'settings-empty', text: 'No settings match your search.', hidden: true });
    const views = new Map();

    const body = h('div', null, SECTIONS.map((sec) => {
      const headId = `acc-head-${sec.id}`;
      const panelId = `acc-panel-${sec.id}`;
      const content = h('div', { class: 'acc__content' });
      const panel = h('div', { class: 'acc__panel', id: panelId, role: 'region', 'aria-labelledby': headId }, h('div', { class: 'acc__inner' }, content));
      const head = h('button', { class: 'acc__head', type: 'button', id: headId, 'aria-expanded': 'false', 'aria-controls': panelId },
        h('span', { class: 'acc__icon', 'aria-hidden': 'true' }, icon(sec.icon)),
        h('span', { class: 'acc__text' }, h('span', { class: 'acc__title', text: sec.title }), h('span', { class: 'acc__desc', text: sec.desc })),
        icon('down', 'acc__chev'));
      const wrap = h('section', { class: 'acc', dataset: { id: sec.id } }, head, panel);
      const view = { sec, wrap, head, panel, content };
      views.set(sec.id, view);
      head.addEventListener('click', () => {
        const isOpen = wrap.classList.contains('is-open');
        if (query.value.trim()) { setOpen(view, !isOpen); return; }
        const next = isOpen ? '' : sec.id;
        views.forEach((v) => setOpen(v, v.sec.id === next));
        UI.set({ settingsSection: next });
      });
      fill(view);
      return wrap;
    }), empty);

    function fill(view) {
      const { sec, content } = view;
      const focusKey = document.activeElement && content.contains(document.activeElement) && document.activeElement.dataset ? document.activeElement.dataset.key : null;
      const refresh = () => fill(view);
      const reset = sec.keys ? h('div', { class: 'acc__foot' }, h('button', {
        class: 'link-btn', type: 'button',
        onclick: () => {
          const patch = {};
          sec.keys.forEach((k) => { patch[k] = clone(DEFAULT_SETTINGS[k]); });
          set(patch);
          fill(view);
          Toast.show(`${sec.title} settings reset`);
        },
      }, icon('reset'), 'Reset to default')) : null;
      content.replaceChildren(...[sec.rows(Settings.get(), refresh)].flat(Infinity).filter(Boolean), reset);
      if (focusKey) { const el = content.querySelector(`[data-key="${CSS.escape(focusKey)}"]`); if (el) el.focus({ preventScroll: true }); }
      applyFilter();
    }
    function setOpen(view, open) {
      view.wrap.classList.toggle('is-open', open);
      view.head.setAttribute('aria-expanded', String(open));
      view.panel.inert = !open;
    }
    function applyFilter() {
      const q = query.value.trim().toLowerCase();
      let matches = 0;
      views.forEach((v) => {
        const titleHit = !q || `${v.sec.title} ${v.sec.desc}`.toLowerCase().includes(q);
        let any = titleHit;
        $$('[data-search]', v.content).forEach((r) => {
          const hit = titleHit || r.dataset.search.includes(q);
          r.hidden = !hit;
          any = any || hit;
        });
        v.wrap.hidden = !any;
        if (any) matches++;
        if (q) setOpen(v, any);
      });
      empty.hidden = matches > 0;
    }
    query.addEventListener('input', () => {
      applyFilter();
      if (!query.value.trim()) views.forEach((v) => setOpen(v, v.sec.id === UI.get().settingsSection));
    });
    query.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && query.value) { e.preventDefault(); e.stopPropagation(); query.value = ''; query.dispatchEvent(new Event('input')); }
    });
    views.forEach((v) => setOpen(v, v.sec.id === UI.get().settingsSection));

    const dialog = Dialog.open({
      title: 'Settings', className: 'dialog--settings', sub: searchBox, body,
      onClose: () => { api = null; },
    });
    api = { close: dialog.close, refreshAll: () => views.forEach(fill) };
  }
  return { open };
})();

/* ---------- Inbox (Notes page) ---------- */
const Inbox = (() => {
  const host = $('#inbox');
  host.addEventListener('click', (e) => {
    const del = e.target.closest('[data-action="capture-delete"]');
    if (del) removeWithUndo(del.dataset.id, 'Capture');
  });
  function render() {
    const captures = Items.all('capture').slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    $('#inbox-count').textContent = captures.length ? pluralise(captures.length, 'item') : '';
    if (!captures.length) {
      host.replaceChildren(emptyState({
        icon: 'inbox', title: 'Start collecting ideas',
        text: 'Thoughts, links and reminders you capture will gather here.',
        action: { label: 'Quick capture', keys: `${MOD} K` },
      }));
      return;
    }
    host.replaceChildren(h('div', { class: 'inbox' }, captures.map((c) => {
      const heading = c.title || c.content.split('\n')[0];
      const rest = c.title ? c.content : c.content.split('\n').slice(1).join('\n').trim();
      return h('article', { class: 'card glass' },
        h('div', { class: 'card__head' },
          h('h3', { class: 'card__title', text: heading }),
          h('button', { class: 'icon-btn icon-btn--sm', type: 'button', dataset: { action: 'capture-delete', id: c.id }, 'aria-label': `Delete “${heading}”` }, icon('trash'))),
        rest ? h('p', { class: 'card__text', text: rest }) : null,
        h('div', { class: 'card__foot' },
          c.meta.category ? h('span', { class: 'tag', text: c.meta.category }) : null,
          h('time', { datetime: c.createdAt, text: Fmt.dateTime(c.createdAt) })));
    })));
  }
  return { render };
})();

/* ---------- Placeholder pages ---------- */
const PAGES = {
  home: { title: 'Home' },
  notes: { title: 'Notes' },
  files: {
    title: 'Files', sub: 'Documents, images and references, kept on this device.', icon: 'files',
    empty: { title: 'Your workspace is ready', text: 'File storage is on its way. Until then, capture links and references and they’ll wait in your Inbox.' },
  },
  connections: {
    title: 'Connections', sub: 'See how your notes, tasks and events relate.', icon: 'connections',
    empty: { title: 'Ideas, linked together', text: 'Every item in STILL can already reference others. Soon you’ll be able to explore those links here.' },
  },
  pins: {
    title: 'Pin Board', sub: 'Visual collections and inspiration.', icon: 'pin',
    empty: { title: 'Start collecting inspiration', text: 'Pin images, quotes and references to build boards. For now, capture anything that catches your eye.' },
  },
};
function emptyState({ icon: iconName, title, text, action, eyebrow }) {
  return h('div', { class: 'workspace glass' },
    h('div', { class: 'empty-state' },
      h('div', { class: 'empty-state__icon', 'aria-hidden': 'true' }, icon(iconName)),
      eyebrow ? h('span', { class: 'eyebrow', text: eyebrow }) : null,
      h('h2', { class: 'empty-state__title', text: title }),
      h('p', { class: 'empty-state__text', text }),
      action ? h('button', { class: 'btn', type: 'button', dataset: { action: 'capture' } }, icon('capture', 'icon--sm'), action.label, h('kbd', { text: action.keys })) : null));
}
function buildPlaceholderPages() {
  for (const [id, page] of Object.entries(PAGES)) {
    if (!page.empty) continue;
    $(`.page[data-page="${id}"]`).replaceChildren(
      h('header', { class: 'page-head' },
        h('div', null,
          h('h1', { class: 'page-head__title', id: `${id}-title`, text: page.title }),
          h('p', { class: 'page-head__sub', text: page.sub }))),
      emptyState({ icon: page.icon, eyebrow: 'Coming soon', ...page.empty, action: { label: 'Quick capture', keys: `${MOD} K` } }));
  }
}

/* ---------- Navigation ----------
   Hash routes (#/notes) work from a local file and on GitHub Pages, keep
   the back button meaningful, and never reload the page. */
const Navigation = (() => {
  const fromHash = () => { const id = location.hash.replace(/^#\/?/, ''); return PAGE_IDS.includes(id) ? id : null; };
  function go(page) {
    if (!PAGE_IDS.includes(page)) page = 'home';
    if (fromHash() !== page) location.hash = `/${page}`;
    else if (UI.get().page !== page) UI.set({ page });
  }
  function syncHash() {
    const page = UI.get().page;
    if (fromHash() !== page) history.replaceState(null, '', `#/${page}`);
  }
  function init() {
    const initial = fromHash();
    if (initial && initial !== UI.get().page) UI.set({ page: initial });
    else syncHash();
    window.addEventListener('hashchange', () => {
      const page = fromHash();
      if (page && page !== UI.get().page) UI.set({ page });
    });
    $('#nav').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-page]');
      if (btn) go(btn.dataset.page);
    });
  }
  function render() {
    const page = UI.get().page;
    $$('#nav [data-page]').forEach((b) => (b.getAttribute('data-page') === page ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
    $$('main > .page').forEach((p) => { p.hidden = p.dataset.page !== page; });
    $('.app').dataset.page = page;
    document.title = page === 'home' ? 'STILL' : `${PAGES[page].title} · STILL`;
    if (page === 'home') Clock.start(); else { Clock.stop(); Popover.close(false); }
  }
  return { init, go, render, syncHash };
})();

/* ---------- Event handling: global actions ---------- */
const ACTIONS = {
  save: () => Backup.download(),
  load: () => $('#file-input').click(),
  capture: () => Capture.open(),
  settings: () => SettingsPanel.open(),
  'cal-prev': () => Calendar.shiftMonth(-1),
  'cal-next': () => Calendar.shiftMonth(1),
  'cal-today': () => Calendar.goToday(),
  'event-new': () => EventEditor.open(),
  'event-edit': (el) => EventEditor.open(el.dataset.id),
  'task-new': () => TaskPanel.openComposer(),
  'week-prev': () => TaskPanel.shiftWeek(-1),
  'week-next': () => TaskPanel.shiftWeek(1),
};
function bindActions() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el);
  });
  $('#file-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    Backup.restoreFromFile(file);
  });
  $('#btn-save').dataset.tip = `Save backup  (${MOD} S)`;
  $('#btn-capture').dataset.tip = `Quick capture  (${MOD} K)`;
}

/* ---------- Keyboard shortcuts ---------- */
function bindKeyboard() {
  const isTyping = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  document.addEventListener('keydown', (e) => {
    const mod = IS_MAC ? e.metaKey : e.ctrlKey;
    const key = e.key.toLowerCase();
    if (mod && !e.altKey && !e.shiftKey && key === 'k') { e.preventDefault(); Capture.open(); return; }
    if (mod && !e.altKey && !e.shiftKey && key === 's') { e.preventDefault(); Backup.download(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || isTyping(e.target) || Dialog.anyOpen() || $('.popover')) return;
    const page = UI.get().page;
    if (key === 'n') {
      if (page === 'home') { e.preventDefault(); TaskPanel.openComposer(); }
      else if (page === 'notes') { e.preventDefault(); Capture.open(); }
    } else if (e.key === '/' && page === 'home') {
      e.preventDefault(); TaskPanel.focusSearch();
    }
  });
}

/* ---------- Drag-and-drop restore ---------- */
function bindDrop() {
  const zone = $('#dropzone');
  let depth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; zone.hidden = false; });
  window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) zone.hidden = true; });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0; zone.hidden = true;
    const file = e.dataTransfer.files[0];
    if (Dialog.anyOpen()) { Toast.show('Close the open dialog before restoring a backup.', { type: 'error' }); return; }
    Backup.restoreFromFile(file);
  });
}

/* ---------- Rendering ----------
   All store changes funnel into one redraw per animation frame. Only the
   visible page is drawn; a page is drawn fresh whenever it is shown. */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  Theme.apply();
  Navigation.render();
  const page = UI.get().page;
  if (page === 'home') {
    Clock.render();
    QuickNotes.render();
    Calendar.render();
    TaskPanel.render();
  } else if (page === 'notes') {
    Inbox.render();
  }
}

/* Day rollover: when midnight passes, "today" moves everywhere. */
function watchDay() {
  let day = Dates.today();
  setInterval(() => {
    if (Dates.today() !== day) { day = Dates.today(); scheduleRender(); }
  }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRender(); });
}

/* ---------- Application initialisation ---------- */
function init() {
  const { state, warning } = Persistence.load();
  Store.replace(state, 'init');
  Store.subscribe((_, reason) => {
    Persistence.schedule();
    scheduleRender();
    if (reason === 'restore' || reason === 'reset') { Popover.close(false); QuickNotes.sync(true); }
  });
  Calendar.build();
  TaskPanel.build();
  buildPlaceholderPages();
  bindActions();
  bindKeyboard();
  bindDrop();
  Navigation.init();
  watchDay();
  render();
  QuickNotes.sync(true);
  if (warning) Toast.show(warning, { type: 'error', duration: 7000 });
}

init();
})();
</script>
