}
function icon(name, extraClass = '') {
  const el = svg('svg', { class: `icon ${extraClass}`.trim(), 'aria-hidden': 'true' });
  el.append(svg('use', { href: `#i-${name}` }));
  return el;
}
function pluralise(n, one, many = `${one}s`) { return `${n} ${n === 1 ? one : many}`; }

/* ---------- Dates ----------
   Calendar dates are stored as local "YYYY-MM-DD" keys and times as
   "HH:MM" wall-clock strings. Events are therefore "floating": 9:00 stays
   9:00 across daylight-saving changes and time-zone moves, which is what
   people expect from a personal calendar. Date arithmetic always goes
   through local noon so a DST shift can never push a day across midnight. */
const pad2 = (n) => String(n).padStart(2, '0');
const KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
const MONTH_RE = /^\d{4}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

const Dates = {
  key(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
  parse(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d, 12); },
  today() { return Dates.key(new Date()); },
  isKey(k) { return typeof k === 'string' && KEY_RE.test(k) && Dates.key(Dates.parse(k)) === k; },
  isMonth(m) { return typeof m === 'string' && MONTH_RE.test(m) && +m.slice(5) >= 1 && +m.slice(5) <= 12; },
  isTime(t) { return typeof t === 'string' && TIME_RE.test(t); },
  addDays(key, n) { const d = Dates.parse(key); d.setDate(d.getDate() + n); return Dates.key(d); },
  month(key) { return key.slice(0, 7); },
  addMonths(month, n) { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; },
  weekday(key) { return Dates.parse(key).getDay(); },
  startOfWeek(key, weekStart) { return Dates.addDays(key, -((Dates.weekday(key) - weekStart + 7) % 7)); },
  /** Inclusive list of day keys. */
  range(from, to) { const out = []; for (let k = from; k <= to; k = Dates.addDays(k, 1)) out.push(k); return out; },
  minutes(t) { const [hh, mm] = t.split(':').map(Number); return hh * 60 + mm; },
  fromMinutes(n) { n = Math.max(0, Math.min(23 * 60 + 59, n)); return `${pad2(Math.floor(n / 60))}:${pad2(n % 60)}`; },
};

/** Locale-aware formatting; formatters are created once. */
const Fmt = (() => {
  const f = (opts) => new Intl.DateTimeFormat(undefined, opts);
  const weekdayLong = f({ weekday: 'long' });
  const weekdayShort = f({ weekday: 'short' });
  const weekdayNarrow = f({ weekday: 'narrow' });
  const fullDate = f({ day: 'numeric', month: 'long', year: 'numeric' });
  const dayMonth = f({ weekday: 'long', day: 'numeric', month: 'long' });
  const shortDay = f({ weekday: 'short', day: 'numeric', month: 'short' });
  const monthYear = f({ month: 'long', year: 'numeric' });
  const dateTime = f({ day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const shortDate = f({ day: 'numeric', month: 'short' });
  // 2023-01-01 was a Sunday: index 0..6 → Sunday..Saturday.
  const dow = (fmt, i) => fmt.format(new Date(2023, 0, 1 + i, 12));
  return {
    weekdayLong: (k) => weekdayLong.format(Dates.parse(k)),
    fullDate: (k) => fullDate.format(Dates.parse(k)),
    dayMonth: (k) => dayMonth.format(Dates.parse(k)),
    shortDay: (k) => shortDay.format(Dates.parse(k)),
    shortDate: (k) => shortDate.format(Dates.parse(k)),
    monthYear: (m) => monthYear.format(Dates.parse(`${m}-01`)),
    dowShort: (i) => dow(weekdayShort, i),
    dowNarrow: (i) => dow(weekdayNarrow, i),
    dateTime: (iso) => dateTime.format(new Date(iso)),
    /** "14:05" or { time: "2:05", suffix: "PM" } depending on the setting. */
    timeParts(hours, minutes, h24) {
      if (h24) return { time: `${pad2(hours)}:${pad2(minutes)}`, suffix: '' };
      return { time: `${hours % 12 || 12}:${pad2(minutes)}`, suffix: hours < 12 ? 'AM' : 'PM' };
    },
    time(hhmm, h24) {
      const [hh, mm] = hhmm.split(':').map(Number);
      const p = Fmt.timeParts(hh, mm, h24);
      return p.suffix ? `${p.time} ${p.suffix}` : p.time;
    },
  };
})();

/* ---------- Model ----------
   Every piece of content is an Item in one collection:
     { id, type, createdAt, updatedAt, title, content, meta, links }
   `type` says what it is (task, event, capture, note, file, connection,
   pin); `meta` holds type-specific fields; `links` holds ids of related
   items so anything can reference anything. One shape means one search,
   one backup format and one place to add relationships later. */
const SCHEMA_VERSION = 1;
const PAGE_IDS = ['home', 'notes', 'files', 'connections', 'pins'];
const ACCENTS = ['#7c8cff', '#5fb3a1', '#d9a35f', '#e0808f', '#a78bfa', '#9aa3b2'];

function detect24h() {
  try { const hc = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hourCycle; return hc === 'h23' || hc === 'h24'; }
  catch { return false; }
}
const DEFAULT_SETTINGS = Object.freeze({ clock24: detect24h(), location: '', accent: ACCENTS[0], weekStart: 1 });

function defaultUi() {
  const today = Dates.today();
  return { page: 'home', calMonth: Dates.month(today), calDay: today, taskDay: today };
}
function defaultState() {
  return { items: [], settings: { ...DEFAULT_SETTINGS }, ui: defaultUi() };
}
function makeItem(type, fields = {}) {
  const t = nowISO();
  return { id: uid(), type, createdAt: t, updatedAt: t, title: '', content: '', meta: {}, links: [], ...fields };
}

const isIso = (v) => typeof v === 'string' && !Number.isNaN(Date.parse(v));
const isHex = (v) => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);

/** Type-specific clean-up. Unknown types pass through untouched so newer data survives. */
const ITEM_NORMALISERS = {
  task(it) {
    it.meta.date = Dates.isKey(it.meta.date) ? it.meta.date : Dates.key(new Date(it.createdAt));
    it.meta.done = it.meta.done === true;
    return it;
  },
  event(it) {
    const m = it.meta;
    if (!Dates.isKey(m.start)) return null;
    if (!Dates.isKey(m.end) || m.end < m.start) m.end = m.start;
    m.allDay = m.allDay === true || !Dates.isTime(m.startTime);
    m.startTime = Dates.isTime(m.startTime) ? m.startTime : null;
    m.endTime = Dates.isTime(m.endTime) ? m.endTime : m.startTime;
    return it;
  },
  capture(it) {
    it.meta.kind = typeof it.meta.kind === 'string' ? it.meta.kind : 'text';
    it.meta.category = typeof it.meta.category === 'string' ? it.meta.category : '';
    return it;
  },
};

function normaliseItem(raw) {
  if (!isObj(raw) || typeof raw.id !== 'string' || !raw.id || typeof raw.type !== 'string' || !raw.type) return null;
  const t = nowISO();
  const it = {
    ...raw, // keep unknown fields
    title: typeof raw.title === 'string' ? raw.title : '',
    content: typeof raw.content === 'string' ? raw.content : '',
    createdAt: isIso(raw.createdAt) ? raw.createdAt : t,
    meta: isObj(raw.meta) ? { ...raw.meta } : {},
    links: Array.isArray(raw.links) ? raw.links.filter((l) => typeof l === 'string') : [],
  };
  it.updatedAt = isIso(raw.updatedAt) ? raw.updatedAt : it.createdAt;
  const fix = ITEM_NORMALISERS[it.type];
  return fix ? fix(it) : it;
}
function normaliseSettings(raw) {
  const s = isObj(raw) ? raw : {};
  return {
    ...s,
    clock24: typeof s.clock24 === 'boolean' ? s.clock24 : DEFAULT_SETTINGS.clock24,
    location: typeof s.location === 'string' ? s.location.slice(0, 80) : '',
    accent: isHex(s.accent) ? s.accent.toLowerCase() : DEFAULT_SETTINGS.accent,
    weekStart: s.weekStart === 0 || s.weekStart === 1 ? s.weekStart : DEFAULT_SETTINGS.weekStart,
  };
}
function normaliseUi(raw) {
  const u = isObj(raw) ? raw : {};
  const d = defaultUi();
  return {
    ...u,
    page: PAGE_IDS.includes(u.page) ? u.page : d.page,
    calMonth: Dates.isMonth(u.calMonth) ? u.calMonth : d.calMonth,
    calDay: Dates.isKey(u.calDay) ? u.calDay : d.calDay,
    taskDay: Dates.isKey(u.taskDay) ? u.taskDay : d.taskDay,
  };
}
/** Accepts anything shaped roughly like state and returns a complete, valid state. */
function normaliseState(raw) {
  const src = isObj(raw) ? raw : {};
  const seen = new Set();
  const items = [];
  for (const r of Array.isArray(src.items) ? src.items : []) {
    const it = normaliseItem(clone(r));
    if (it && !seen.has(it.id)) { seen.add(it.id); items.push(it); }
  }
  return { ...src, items, settings: normaliseSettings(src.settings), ui: normaliseUi(src.ui) };
}
/** Last line of defence before anything is written to storage. */
function isValidState(s) {
  return isObj(s) && Array.isArray(s.items) && isObj(s.settings) && isObj(s.ui) && s.items.every((i) => isObj(i) && typeof i.id === 'string');
}

/* ---------- State management ----------
   The store is the single source of truth. `update` mutates in place and
   notifies subscribers with a reason so they can decide what to do. */
const Store = (() => {
  let state = defaultState();
  const subscribers = new Set();
  const emit = (reason) => subscribers.forEach((fn) => fn(state, reason));
  return {
    get: () => state,
    replace(next, reason = 'replace') { state = next; emit(reason); },
    update(mutate, reason = 'change') { mutate(state); emit(reason); },
    subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
  };
})();

/** Item actions — the only code that changes items. */
const Items = {
  all(type) { const items = Store.get().items; return type ? items.filter((i) => i.type === type) : items; },
  get(id) { return Store.get().items.find((i) => i.id === id) || null; },
  create(type, fields) {
    const item = makeItem(type, fields);
    Store.update((s) => { s.items.push(item); }, 'items');
    return item;
  },
  update(id, patch) {
    Store.update((s) => {
      const it = s.items.find((i) => i.id === id);
      if (!it) return;
      const { meta, ...rest } = patch;
      Object.assign(it, rest);
      if (meta) it.meta = { ...it.meta, ...meta };
      it.updatedAt = nowISO();
    }, 'items');
  },
  /** Removes an item and returns a token that `restore` can put back exactly where it was. */
  remove(id) {
    let token = null;
    Store.update((s) => {
      const index = s.items.findIndex((i) => i.id === id);
      if (index >= 0) token = { item: s.items.splice(index, 1)[0], index };
    }, 'items');
    return token;
  },
  restore(token) {
    if (!token) return;
    Store.update((s) => {
      if (s.items.some((i) => i.id === token.item.id)) return;
      s.items.splice(Math.min(token.index, s.items.length), 0, token.item);
    }, 'items');
  },
};
const Settings = {
  get: () => Store.get().settings,
  set(patch) { Store.update((s) => Object.assign(s.settings, patch), 'settings'); },
};
const UI = {
  get: () => Store.get().ui,
  set(patch) { Store.update((s) => Object.assign(s.ui, patch), 'ui'); },
};

/* ---------- Data storage ----------
   The storage adapter is the only code that touches localStorage.
   localStorage suits today's text-only data; larger content (files,
   images) should move to IndexedDB by swapping this adapter, with items
   keeping only references to the stored blobs. */
const STORAGE_KEY = 'still.state';
const LocalAdapter = {
  read: (key = STORAGE_KEY) => localStorage.getItem(key),
  write: (value, key = STORAGE_KEY) => localStorage.setItem(key, value),
};

const Persistence = (() => {
  let lastWritten = null;
  let timer = 0;
  let failing = false;
  const serialise = (state) => JSON.stringify({ format: 'still-local', version: SCHEMA_VERSION, data: state });

  function load() {
    let raw;
    try { raw = LocalAdapter.read(); }
    catch { return { state: defaultState(), warning: 'Local storage is unavailable, so changes won’t be kept after closing. Use Save to keep a backup.' }; }
    if (!raw) return { state: defaultState(), firstRun: true };
    let result;
    try { result = Backup.decode(JSON.parse(raw)); } catch { result = { ok: false }; }
    if (!result.ok) {
      // Never discard what we can't read: keep the raw text beside the new state.
      try { LocalAdapter.write(raw, `${STORAGE_KEY}.unreadable-${Date.now()}`); } catch { /* storage full */ }
      return { state: defaultState(), warning: 'Saved data couldn’t be read. A copy was kept and STILL started fresh.' };
    }
    lastWritten = serialise(result.data);
    return { state: result.data };
  }
  function save() {
    clearTimeout(timer); timer = 0;
    const state = Store.get();
    if (!isValidState(state)) { console.error('STILL: refusing to persist invalid state'); return; }
    const text = serialise(state);
    if (text === lastWritten) return;
    try {
      LocalAdapter.write(text);
      lastWritten = text;
      failing = false;
    } catch (err) {
      console.error('STILL: local save failed', err);
      if (!failing) Toast.show('Couldn’t save on this device — storage may be full. Use Save to download a backup.', { type: 'error', duration: 6000 });
      failing = true;
    }
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(save, 250); }
  function keepCopy(state, label) {
    try { LocalAdapter.write(serialise(state), `${STORAGE_KEY}.${label}`); } catch { /* best effort */ }
  }
  // Flush pending writes when the page is hidden or closed.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) save(); });
  window.addEventListener('pagehide', () => { if (timer) save(); });
  return { load, save, schedule, keepCopy };
})();

/* ---------- Backup and restoration ----------
   Backup file format (documented in README.md):
     { format: "still-backup", version: 1, app: "STILL",
       createdAt: ISO-8601, data: { items, settings, ui, …unknown } }
   Older versions are upgraded through MIGRATIONS; newer versions are
   refused rather than guessed at. Unknown fields are preserved. */
const Backup = (() => {
  const FORMAT = 'still-backup';
  const MAX_BYTES = 50 * 1024 * 1024;
  /** MIGRATIONS[n] upgrades data from version n to n + 1. */
  const MIGRATIONS = {};
  const fail = (error) => ({ ok: false, error });

  function encode(state) {
    return { format: FORMAT, version: SCHEMA_VERSION, app: 'STILL', createdAt: nowISO(), data: clone(state) };
  }
  function decode(obj) {
    if (!isObj(obj)) return fail('it isn’t a STILL backup.');
    let version; let data;
    if (obj.format === FORMAT || obj.format === 'still-local') { version = obj.version; data = obj.data; }
    else if (Array.isArray(obj.items) && isObj(obj.settings)) { version = 1; data = obj; } // bare state
    else return fail('it isn’t a STILL backup.');
    if (!Number.isInteger(version) || version < 1) return fail('the backup version is missing.');
    if (version > SCHEMA_VERSION) return fail('it was made by a newer version of STILL.');
    if (!isObj(data)) return fail('the backup has no data.');
    if ('items' in data && !Array.isArray(data.items)) return fail('its items are damaged.');
    if ('settings' in data && !isObj(data.settings)) return fail('its settings are damaged.');
    for (let v = version; v < SCHEMA_VERSION; v++) data = MIGRATIONS[v](data);
    return { ok: true, data: normaliseState(data), createdAt: isIso(obj.createdAt) ? obj.createdAt : null };
  }

  function download() {
    try {
      const json = JSON.stringify(encode(Store.get()), null, 2);
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = h('a', { href: url, download: `dashboard-backup-${Dates.today()}.json` });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      Toast.show('Saved — backup downloaded');
    } catch (err) {
      console.error('STILL: backup failed', err);
      Toast.show('Save error — the backup couldn’t be created.', { type: 'error' });
    }
  }

  function summary(result) {
    const counts = {};
    for (const it of result.data.items) counts[it.type] = (counts[it.type] || 0) + 1;
    const parts = [];
    if (counts.task) parts.push(pluralise(counts.task, 'task'));
    if (counts.event) parts.push(pluralise(counts.event, 'event'));
    if (counts.capture) parts.push(pluralise(counts.capture, 'capture'));
    const other = result.data.items.length - (counts.task || 0) - (counts.event || 0) - (counts.capture || 0);
    if (other) parts.push(pluralise(other, 'other item'));
    const when = result.createdAt ? `Backup from ${Fmt.dateTime(result.createdAt)}` : 'Backup';
    return `${when} · ${parts.length ? parts.join(', ') : 'no items'}`;
  }

  /** Read → parse → validate → confirm → restore. Nothing changes until the user confirms. */
  async function restoreFromFile(file) {
    if (!file) return;
    if (file.size > MAX_BYTES) { Toast.show('Invalid file — it’s too large to be a STILL backup.', { type: 'error' }); return; }
    let text;
    try { text = await file.text(); }
    catch { Toast.show('Load error — the file couldn’t be read.', { type: 'error' }); return; }
    let parsed;
    try { parsed = JSON.parse(text); }
    catch { Toast.show('Invalid file — it isn’t valid JSON.', { type: 'error' }); return; }
    const result = decode(parsed);
    if (!result.ok) { Toast.show(`Invalid file — ${result.error}`, { type: 'error' }); return; }

    const confirmed = await Dialog.confirm({
      title: 'Restore backup?',
      message: 'This will replace your current data. Are you sure you want to continue?',
      detail: summary(result),
      confirmLabel: 'Confirm',
    });
    if (!confirmed) return;
    try {
      Persistence.keepCopy(Store.get(), 'before-restore');
      Store.replace(result.data, 'restore');
      Persistence.save();
      Navigation.syncHash();
      Toast.show('Loaded — your backup has been restored');
    } catch (err) {
      console.error('STILL: restore failed', err);
      Toast.show('Load error — your existing data was left unchanged.', { type: 'error' });
    }
  }
  return { encode, decode, download, restoreFromFile };
})();

/* ---------- Search ----------
   One text index over every item type. Tasks use it today; global search
   can call the same function with more types. */
const Search = {
  text(item) { return [item.title, item.content, item.meta && item.meta.category].filter(Boolean).join(' ').toLowerCase(); },
  query(q, { types } = {}) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    return Items.all().filter((it) => (!types || types.includes(it.type)) && terms.every((t) => Search.text(it).includes(t)));
  },
};

/* ---------- Domain helpers ---------- */
const Tasks = {
  on(day) { return Items.all('task').filter((t) => t.meta.date === day); },
  progress(day) { const list = Tasks.on(day); return { total: list.length, done: list.filter((t) => t.meta.done).length }; },
};
const Events = {
  occursOn(ev, day) { return ev.meta.start <= day && day <= ev.meta.end; },
  on(day) {
    return Items.all('event')
      .filter((e) => Events.occursOn(e, day))
      .sort((a, b) => (a.meta.allDay === b.meta.allDay ? 0 : a.meta.allDay ? -1 : 1)
        || (a.meta.startTime || '').localeCompare(b.meta.startTime || '')
        || a.title.localeCompare(b.title));
  },
  /** Map of day → number of events, for the visible calendar range only. */
  countRange(from, to) {
    const counts = new Map();
    for (const ev of Items.all('event')) {
      if (ev.meta.end < from || ev.meta.start > to) continue;
      const a = ev.meta.start < from ? from : ev.meta.start;
      const b = ev.meta.end > to ? to : ev.meta.end;
      for (const day of Dates.range(a, b)) counts.set(day, (counts.get(day) || 0) + 1);
    }
    return counts;
  },
  label(ev, day) {
    const { allDay, start, end, startTime, endTime } = ev.meta;
    const h24 = Settings.get().clock24;
    if (start === end) return allDay ? 'All day' : `${Fmt.time(startTime, h24)} – ${Fmt.time(endTime, h24)}`;
    const span = `${Fmt.shortDate(start)} – ${Fmt.shortDate(end)}`;
    if (allDay) return `All day · ${span}`;
    if (day === start) return `From ${Fmt.time(startTime, h24)} · ${span}`;
    if (day === end) return `Until ${Fmt.time(endTime, h24)} · ${span}`;
    return `All day · ${span}`;
  },
};

/* ---------- Toasts ---------- */
const Toast = (() => {
  const host = $('#toasts');
  // As a popover the stack sits in the top layer, above open dialogs.
  const canPopover = typeof host.showPopover === 'function';
  if (canPopover) host.setAttribute('popover', 'manual');
  function raise() {
    if (!canPopover) return;
    try { if (host.matches(':popover-open')) host.hidePopover(); host.showPopover(); } catch { /* ignore */ }
  }
  function dismiss(el) {
    if (!el.isConnected || el.classList.contains('is-leaving')) return;
    el.classList.add('is-leaving');
    setTimeout(() => {
      el.remove();
      if (canPopover && !host.children.length) { try { host.hidePopover(); } catch { /* ignore */ } }
    }, prefersReducedMotion() ? 0 : 200);
  }
  function show(message, { type = 'info', action = null, duration = action ? 5000 : 3000 } = {}) {
    const el = h('div', { class: `toast toast--${type}`, role: type === 'error' ? 'alert' : null },
      h('span', { class: 'toast__dot', 'aria-hidden': 'true' }),
      h('span', { class: 'toast__msg', text: message }),
      action && h('button', { class: 'btn btn--ghost btn--sm', type: 'button', text: action.label, onclick: () => { action.run(); dismiss(el); } }));
    host.append(el);
    while (host.children.length > 3) host.firstElementChild.remove();
    raise();
    let timer = setTimeout(() => dismiss(el), duration);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(() => dismiss(el), 1500); });
    return el;
  }
  return { show };
})();

/** Delete with an Undo toast: nothing is ever removed silently. */
function removeWithUndo(id, noun) {
  const token = Items.remove(id);
  if (token) Toast.show(`${noun} deleted`, { action: { label: 'Undo', run: () => Items.restore(token) } });
}

/* ---------- Dialogs ----------
   Native <dialog> gives focus trapping, Escape and the top layer. Each
   dialog is created on open and removed on close, so they can stack. */
const Dialog = (() => {
  let seq = 0;
  function open({ title, body, actions = [], className = '', dismissOnBackdrop = true, onClose = null, initialFocus = null, onSubmit = null }) {
    const titleId = `dialog-title-${++seq}`;
    const returnFocus = document.activeElement;
    const form = h('form', { class: 'dialog__form', novalidate: true, style: 'display:contents' });
    const el = h('dialog', { class: `dialog ${className}`.trim(), 'aria-labelledby': titleId }, form);
    let closed = false;

    const buttons = actions.map((a) => (a === 'spacer' ? h('span', { class: 'spacer' }) : a instanceof Node ? a : h('button', {
      class: `btn ${a.variant ? `btn--${a.variant}` : ''}`.trim(),
      type: a.submit ? 'submit' : 'button',
      text: a.label,
      onclick: a.submit ? null : () => a.run ? a.run(close) : close(),
    })));
    appendChildren(form, [
      h('div', { class: 'dialog__head' },
        h('h2', { class: 'dialog__title', id: titleId, text: title }),
        h('button', { class: 'icon-btn icon-btn--sm', type: 'button', 'aria-label': 'Close', onclick: () => close() }, icon('x'))),
      h('div', { class: 'dialog__body' }, body),
      buttons.length ? h('div', { class: 'dialog__foot' }, buttons) : null,
    ]);
    form.addEventListener('submit', (e) => { e.preventDefault(); if (onSubmit) onSubmit(close); });

    function close(result) {
      if (closed) return;
      closed = true;
      const finish = () => {
        el.close();
        el.remove();
        if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll: true });
        if (onClose) onClose(result);
      };
      if (prefersReducedMotion()) finish();
      else { el.classList.add('is-closing'); setTimeout(finish, 140); }
    }
    el.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    // Close on a backdrop click (press and release both outside the content box).
    let downOnBackdrop = false;
    el.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === el && isOutside(el, e); });
    el.addEventListener('click', (e) => {
      if (dismissOnBackdrop && downOnBackdrop && e.target === el && isOutside(el, e)) close();
      downOnBackdrop = false;
    });

    document.body.append(el);
    el.showModal();
    const focusEl = initialFocus ? (typeof initialFocus === 'string' ? $(initialFocus, el) : initialFocus) : null;
    if (focusEl) focusEl.focus();
    return { el, close };
  }
  function isOutside(el, e) {
    const r = el.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  }
  function confirm({ title, message, detail = '', confirmLabel = 'Confirm', danger = false }) {
    return new Promise((resolve) => {
      let answer = false;
      open({
        title,
        body: [h('p', { text: message }), detail ? h('p', { class: 'confirm__detail', text: detail }) : null],
        actions: ['spacer',
          { label: 'Cancel', run: (close) => close() },
          { label: confirmLabel, variant: danger ? 'danger' : 'primary', run: (close) => { answer = true; close(); } }],
        initialFocus: '.dialog__foot .btn:last-child',
        onClose: () => resolve(answer),
      });
    });
  }
  const anyOpen = () => !!$('dialog[open]');
  return { open, confirm, anyOpen };
})();

/* ---------- Theme ---------- */
const Theme = (() => {
  let applied = null;
  function onAccent(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return lum > 0.18 ? '#0e0f12' : '#ffffff';
  }
  function apply() {
    const accent = Settings.get().accent;
    if (accent === applied) return;
    applied = accent;
    const root = document.documentElement.style;
    root.setProperty('--accent', accent);
    root.setProperty('--on-accent', onAccent(accent));
  }
  return { apply };
})();

/* ---------- Clock ----------
   One Date per frame drives both the hands and the digits, so they can
   never disagree. Runs only while Home is visible. */
const Clock = (() => {
  const hands = { h: $('#hand-hour'), m: $('#hand-minute'), s: $('#hand-second') };
  const timeEl = $('#clock-time');
  const ampmEl = $('#clock-ampm');
  let raf = 0;
  let lastDigital = '';

  function build() {
    const g = $('#clock-ticks');
    for (let i = 0; i < 60; i++) {
      const hour = i % 5 === 0;
      const a = (i / 60) * Math.PI * 2;
      const r1 = hour ? 82 : 87;
      const r2 = 91;
      g.append(svg('line', {
        class: `clock__tick${hour ? ' clock__tick--hour' : ''}`,
        x1: (100 + Math.sin(a) * r1).toFixed(2), y1: (100 - Math.cos(a) * r1).toFixed(2),
        x2: (100 + Math.sin(a) * r2).toFixed(2), y2: (100 - Math.cos(a) * r2).toFixed(2),
      }));
    }
  }
  function paint(now) {
    const smooth = !prefersReducedMotion();
    const sec = now.getSeconds() + (smooth ? now.getMilliseconds() / 1000 : 0);
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;
    hands.s.setAttribute('transform', `rotate(${(sec * 6).toFixed(2)} 100 100)`);
    hands.m.setAttribute('transform', `rotate(${(min * 6).toFixed(2)} 100 100)`);
    hands.h.setAttribute('transform', `rotate(${(hr * 30).toFixed(2)} 100 100)`);
    const p = Fmt.timeParts(now.getHours(), now.getMinutes(), Settings.get().clock24);
    const digital = `${p.time}|${p.suffix}`;
    if (digital !== lastDigital) {
      lastDigital = digital;
      timeEl.textContent = p.time;
      timeEl.dateTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      ampmEl.textContent = p.suffix;
    }
  }
  function frame() { paint(new Date()); raf = requestAnimationFrame(frame); }
  function start() { if (!raf) frame(); }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  function autoCity() {
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      const city = tz.split('/').pop();
      return city && city !== 'UTC' ? city.replace(/_/g, ' ') : 'Local time';
    } catch { return 'Local time'; }
  }
  function zoneName() {
    try { return new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(new Date()).find((p) => p.type === 'timeZoneName').value; }
    catch { return ''; }
  }
  /** Static parts: location, zone, and forcing the digits to redraw after a format change. */
  function render() {
    $('#clock-location').textContent = Settings.get().location.trim() || autoCity();
    $('#clock-zone').textContent = zoneName();
    lastDigital = '';
    if (raf) paint(new Date());
  }
  return { build, start, stop, render, autoCity };
})();

/* ---------- Calendar ---------- */
const Calendar = (() => {
  const grid = $('#cal-grid');
  const dowRow = $('#cal-dow');
  const cells = [];
  let focusDay = null;

  function build() {
    for (let i = 0; i < 7; i++) dowRow.append(h('div', { class: 'cal__dow' }));
    for (let i = 0; i < 42; i++) {
      const dots = h('span', { class: 'cal__dots', 'aria-hidden': 'true' });
      const num = h('span');
      const btn = h('button', { class: 'cal__day', type: 'button' }, num, dots);
      cells.push({ btn, num, dots });
      grid.append(btn);
    }
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.cal__day');
      if (btn) select(btn.dataset.day);
    });
    grid.addEventListener('keydown', onKey);
  }
  function select(day, { focus = false } = {}) {
    if (!Dates.isKey(day)) return;
    if (focus) focusDay = day;
    UI.set({ calDay: day, calMonth: Dates.month(day) });
  }
  function onKey(e) {
    const btn = e.target.closest('.cal__day');
    if (!btn) return;
    const day = btn.dataset.day;
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
    let next = null;
    if (e.key in moves) next = Dates.addDays(day, moves[e.key]);
    else if (e.key === 'PageUp') next = Dates.addMonths(Dates.month(day), -1) + day.slice(7);
    else if (e.key === 'PageDown') next = Dates.addMonths(Dates.month(day), 1) + day.slice(7);
    else if (e.key === 'Home') next = Dates.startOfWeek(day, Settings.get().weekStart);
    else if (e.key === 'End') next = Dates.addDays(Dates.startOfWeek(day, Settings.get().weekStart), 6);
    if (!next) return;
    e.preventDefault();
    if (!Dates.isKey(next)) { // e.g. 31 → a 30-day month: clamp to the month's last day
      const m = next.slice(0, 7);
      const last = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
      next = `${m}-${pad2(last)}`;
    }
    select(next, { focus: true });
  }

  function render() {
    const { calMonth, calDay } = UI.get();
    const { weekStart } = Settings.get();
    const today = Dates.today();

    $('#cal-weekday').textContent = Fmt.weekdayLong(today);
    $('#cal-date').textContent = Fmt.fullDate(today);
    $('#cal-month').textContent = Fmt.monthYear(calMonth);
    dowRow.childNodes.forEach((el, i) => {
      const d = (weekStart + i) % 7;
      el.textContent = Fmt.dowShort(d).slice(0, 2);
      el.title = Fmt.dowShort(d);
    });

    const first = `${calMonth}-01`;
    const start = Dates.startOfWeek(first, weekStart);
    const end = Dates.addDays(start, 41);
    const counts = Events.countRange(start, end);
    const tabbable = calDay >= start && calDay <= end && Dates.month(calDay) === calMonth ? calDay : first;

    cells.forEach((c, i) => {
      const day = Dates.addDays(start, i);
      const n = counts.get(day) || 0;
      c.btn.dataset.day = day;
      c.btn.className = `cal__day${Dates.month(day) !== calMonth ? ' is-outside' : ''}${day === today ? ' is-today' : ''}`;
      c.btn.setAttribute('aria-pressed', String(day === calDay));
      c.btn.tabIndex = day === tabbable ? 0 : -1;
      c.btn.setAttribute('aria-label', `${Fmt.dayMonth(day)}${day === today ? ', today' : ''}${n ? `, ${pluralise(n, 'event')}` : ''}`);
      if (day === today) c.btn.setAttribute('aria-current', 'date'); else c.btn.removeAttribute('aria-current');
      c.num.textContent = String(+day.slice(8));
      if (c.dots.childElementCount !== Math.min(n, 3)) {
        c.dots.replaceChildren(...Array.from({ length: Math.min(n, 3) }, () => h('span', { class: 'cal__dot' })));
      }
    });
    if (focusDay) {
      const target = cells.find((c) => c.btn.dataset.day === focusDay);
      if (target) target.btn.focus();
      focusDay = null;
    }
    renderAgenda(calDay, today);
  }
  function renderAgenda(day, today) {
    $('#agenda-title').textContent = day === today ? 'Today' : Fmt.shortDay(day);
    const list = $('#agenda-list');
    const events = Events.on(day);
    if (!events.length) {
      list.replaceChildren(h('li', { class: 'empty' }, icon('calendar'), day === today ? 'Nothing scheduled today.' : 'Nothing scheduled.'));
      return;
    }
    list.replaceChildren(...events.map((ev) => h('li', null,
      h('button', { class: 'event', type: 'button', dataset: { action: 'event-edit', id: ev.id }, 'aria-label': `Edit ${ev.title}` },
        h('span', { class: 'event__bar', 'aria-hidden': 'true' }),
        h('span', { class: 'event__body' },
          h('span', { class: 'event__title', text: ev.title }),
          h('span', { class: 'event__time', text: Events.label(ev, day) }))))));
  }
  function shiftMonth(n) { UI.set({ calMonth: Dates.addMonths(UI.get().calMonth, n) }); }
  function goToday() { const t = Dates.today(); UI.set({ calDay: t, calMonth: Dates.month(t) }); }
  return { build, render, shiftMonth, goToday };
})();

/* ---------- Event editor ---------- */
const EventEditor = (() => {
  function defaultTimes(day) {
    if (day !== Dates.today()) return ['09:00', '10:00'];
    const now = new Date();
    const startMin = Math.min((now.getHours() + 1) * 60, 22 * 60);
    return [Dates.fromMinutes(startMin), Dates.fromMinutes(startMin + 60)];
  }
  function open(eventId = null) {
    const existing = eventId ? Items.get(eventId) : null;
    const day = UI.get().calDay;
    const [t1, t2] = defaultTimes(day);
    const m = existing ? existing.meta : { start: day, end: day, startTime: t1, endTime: t2, allDay: false };

    const title = h('input', { class: 'input', type: 'text', value: existing ? existing.title : '', placeholder: 'Event title', 'aria-label': 'Title', maxlength: 200, autocomplete: 'off' });
    const allDay = h('input', { type: 'checkbox', checked: m.allDay });
    const startDate = h('input', { class: 'input', type: 'date', value: m.start, 'aria-label': 'Start date', required: true });
    const startTime = h('input', { class: 'input', type: 'time', value: m.startTime || t1, 'aria-label': 'Start time' });
    const endDate = h('input', { class: 'input', type: 'date', value: m.end, 'aria-label': 'End date', required: true });
    const endTime = h('input', { class: 'input', type: 'time', value: m.endTime || t2, 'aria-label': 'End time' });
    const error = h('p', { class: 'form-error', role: 'alert' });

    const syncAllDay = () => { startTime.hidden = endTime.hidden = allDay.checked; };
    syncAllDay();
    allDay.addEventListener('change', syncAllDay);
    // Keep the end after the start when the start moves forward.
    const startStamp = () => `${startDate.value}T${allDay.checked ? '00:00' : startTime.value}`;
    const endStamp = () => `${endDate.value}T${allDay.checked ? '00:00' : endTime.value}`;
    let lastStart = { date: startDate.value, time: startTime.value };
    const onStartChange = () => {
      if (Dates.isKey(startDate.value) && Dates.isKey(lastStart.date) && Dates.isKey(endDate.value)) {
        const shift = (Dates.parse(startDate.value) - Dates.parse(lastStart.date)) / 864e5;
        if (shift) endDate.value = Dates.addDays(endDate.value, Math.round(shift));
      }
      if (startDate.value === endDate.value && Dates.isTime(startTime.value) && Dates.isTime(lastStart.time) && Dates.isTime(endTime.value)) {
        const delta = Dates.minutes(startTime.value) - Dates.minutes(lastStart.time);
        endTime.value = Dates.fromMinutes(Dates.minutes(endTime.value) + delta);
      }
      lastStart = { date: startDate.value, time: startTime.value };
    };
    startDate.addEventListener('change', onStartChange);
    startTime.addEventListener('change', onStartChange);

    const body = h('div', { class: 'form' },
      h('label', { class: 'field' }, h('span', { class: 'field__label', text: 'Title' }), title),
      h('label', { class: 'switch' }, allDay, 'All day'),
      h('div', { class: 'field' }, h('span', { class: 'field__label', text: 'Starts' }), h('div', { class: 'field-row' }, startDate, startTime)),
      h('div', { class: 'field' }, h('span', { class: 'field__label', text: 'Ends' }), h('div', { class: 'field-row' }, endDate, endTime)),
      error);

    function save(close) {
      const name = title.value.trim();
      title.setAttribute('aria-invalid', String(!name));
      if (!name) { error.textContent = 'Give the event a title.'; title.focus(); return; }
      if (!Dates.isKey(startDate.value) || !Dates.isKey(endDate.value)) { error.textContent = 'Choose a start and end date.'; return; }
      if (!allDay.checked && (!Dates.isTime(startTime.value) || !Dates.isTime(endTime.value))) { error.textContent = 'Choose a start and end time.'; return; }
      if (endStamp() < startStamp()) { error.textContent = 'The event can’t end before it starts.'; return; }
      const meta = {
        start: startDate.value, end: endDate.value, allDay: allDay.checked,
        startTime: allDay.checked ? null : startTime.value, endTime: allDay.checked ? null : endTime.value,
      };
      if (existing) Items.update(existing.id, { title: name, meta });
      else Items.create('event', { title: name, meta });
      UI.set({ calDay: meta.start, calMonth: Dates.month(meta.start) });
      Toast.show(existing ? 'Event updated' : 'Event added');
      close();
    }

    const actions = [];
    if (existing) actions.push({ label: 'Delete', variant: 'danger', run: (close) => { close(); removeWithUndo(existing.id, 'Event'); } });
    actions.push('spacer', { label: 'Cancel' }, { label: existing ? 'Save' : 'Add event', variant: 'primary', submit: true });
    Dialog.open({ title: existing ? 'Edit event' : 'New event', body, actions, dismissOnBackdrop: false, initialFocus: title, onSubmit: save });
  }
  return { open };
})();

/* ---------- Tasks panel ---------- */
const TaskPanel = (() => {
  const RING_C = 2 * Math.PI * 15.5;
  const list = $('#task-list');
  const search = $('#task-search');
  const composer = $('#task-composer');
  const composerInput = $('#task-composer-input');
  const weekRow = $('#week-days');
  const days = [];
  let editing = null;   // id of the task being edited inline (pauses list redraws)
  let focusAfter = null; // selector to focus after the next list redraw

  function build() {
    for (let i = 0; i < 7; i++) {
      const fill = svg('circle', { class: 'ring__fill', cx: 18, cy: 18, r: 15.5, 'stroke-dasharray': `0 ${RING_C}` });
      const ringSvg = svg('svg', { viewBox: '0 0 36 36', 'aria-hidden': 'true' });
      ringSvg.append(svg('circle', { class: 'ring__track', cx: 18, cy: 18, r: 15.5 }), fill);
      const label = h('span', { class: 'ring__label', 'aria-hidden': 'true' });
      const num = h('span', { class: 'wday__num', 'aria-hidden': 'true' });
      const btn = h('button', { class: 'wday', type: 'button' }, h('span', { class: 'ring' }, ringSvg, label), num);
      days.push({ btn, fill, label, num });
      weekRow.append(btn);
    }
    weekRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.wday');
      if (btn) UI.set({ taskDay: btn.dataset.day });
    });
    search.addEventListener('input', render);
    search.addEventListener('keydown', (e) => { if (e.key === 'Escape' && search.value) { e.stopPropagation(); search.value = ''; render(); } });

    composer.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = composerInput.value.trim();
      if (!title) return;
      Items.create('task', { title, meta: { date: UI.get().taskDay, done: false } });
      composerInput.value = '';
    });
    composerInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeComposer(); } });
    composerInput.addEventListener('blur', () => { if (!composerInput.value.trim()) closeComposer(false); });

    list.addEventListener('change', (e) => {
      const box = e.target.closest('.check');
      if (box) Items.update(box.closest('.task').dataset.id, { meta: { done: box.checked } });
    });
    list.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const id = el.closest('.task').dataset.id;
      if (el.dataset.action === 'task-edit') beginEdit(id);
      if (el.dataset.action === 'task-delete') {
        const next = el.closest('.task').nextElementSibling || el.closest('.task').previousElementSibling;
        if (next && next.dataset.id) focusAfter = `[data-id="${next.dataset.id}"] .task__text`;
        removeWithUndo(id, 'Task');
      }
    });
  }

  function openComposer() {
    if (search.value) { search.value = ''; }
    composer.hidden = false;
    composerInput.focus();
    render();
  }
  function closeComposer(refocus = true) {
    composerInput.value = '';
    composer.hidden = true;
    if (refocus) $('[data-action="task-new"]').focus();
  }

  function beginEdit(id) {
    const item = Items.get(id);
    const row = list.querySelector(`.task[data-id="${CSS.escape(id)}"]`);
    if (!item || !row) return;
    editing = id;
    const input = h('input', { class: 'input input--inline', type: 'text', value: item.title, maxlength: 500, 'aria-label': 'Edit task' });
    $('.task__text', row).replaceWith(input);
    input.focus();
    input.select();
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      editing = null;
      focusAfter = `[data-id="${CSS.escape(id)}"] .task__text`;
      const value = input.value.trim();
      // An empty edit reverts rather than deleting: deletion is always explicit.
      if (save && value && value !== item.title) Items.update(id, { title: value });
      else render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  function taskRow(task, { showDate = false } = {}) {
    const done = task.meta.done;
    return h('li', { class: `task${done ? ' is-done' : ''}`, dataset: { id: task.id } },
      h('label', { class: 'check-hit' }, h('input', { class: 'check', type: 'checkbox', checked: done, 'aria-label': `Complete “${task.title}”` })),
      h('button', { class: 'task__text', type: 'button', dataset: { action: 'task-edit' }, text: task.title, 'aria-label': `Edit “${task.title}”` }),
      showDate ? h('span', { class: 'tag task__date', text: Fmt.shortDate(task.meta.date) }) : null,
      h('button', { class: 'icon-btn icon-btn--sm icon-btn--danger', type: 'button', dataset: { action: 'task-delete' }, 'aria-label': `Delete “${task.title}”` }, icon('trash')));
  }

  function renderWeek(taskDay, today, weekStart) {
    const start = Dates.startOfWeek(taskDay, weekStart);
    let weekDone = 0; let weekTotal = 0;
    days.forEach((d, i) => {
      const day = Dates.addDays(start, i);
      const { total, done } = Tasks.progress(day);
      weekDone += done; weekTotal += total;
      const ratio = total ? done / total : 0;
      d.btn.dataset.day = day;
      d.btn.setAttribute('aria-pressed', String(day === taskDay));
      d.btn.setAttribute('aria-label', `${Fmt.dayMonth(day)}: ${total ? `${done} of ${total} tasks done` : 'no tasks'}`);
      d.btn.classList.toggle('is-today', day === today);
      d.btn.classList.toggle('is-complete', total > 0 && done === total);
      d.fill.setAttribute('stroke-dasharray', `${(ratio * RING_C).toFixed(2)} ${RING_C.toFixed(2)}`);
      d.fill.style.opacity = ratio ? '1' : '0';
      d.label.textContent = Fmt.dowNarrow(Dates.weekday(day));
      d.num.textContent = String(+day.slice(8));
    });
    $('#tasks-week-meta').textContent = weekTotal ? `${weekDone} of ${weekTotal} this week` : '';
  }

  function render() {
    const { taskDay } = UI.get();
    const today = Dates.today();
    renderWeek(taskDay, today, Settings.get().weekStart);
    if (editing) return; // don't pull the input out from under the user

    const q = search.value.trim();
    let rows; let emptyText;
    if (q) {
      const found = Search.query(q, { types: ['task'] })
        .sort((a, b) => a.meta.date.localeCompare(b.meta.date) || a.createdAt.localeCompare(b.createdAt));
      $('#tasks-day').textContent = 'Search results';
      $('#tasks-count').textContent = pluralise(found.length, 'match', 'matches');
      rows = found.map((t) => taskRow(t, { showDate: true }));
      emptyText = `No tasks match “${q}”.`;
    } else {
      const tasks = Tasks.on(taskDay);
      const done = tasks.filter((t) => t.meta.done).length;
      $('#tasks-day').textContent = taskDay === today ? 'Today' : Fmt.dayMonth(taskDay);
      $('#tasks-count').textContent = tasks.length ? `${done} of ${tasks.length} done` : '';
      rows = tasks.map((t) => taskRow(t));
      emptyText = 'Your tasks are clear.';
    }
    const showEmpty = !rows.length && composer.hidden;
    list.replaceChildren(...(showEmpty ? [h('li', { class: 'empty' }, icon('check'), emptyText)] : rows));
    if (focusAfter) {
      const el = list.querySelector(focusAfter);
      if (el) el.focus();
      focusAfter = null;
    }
  }
  function shiftWeek(n) { UI.set({ taskDay: Dates.addDays(UI.get().taskDay, n * 7) }); }
  return { build, render, openComposer, shiftWeek, focusSearch: () => { search.focus(); search.select(); } };
})();

/* ---------- Quick capture ----------
   Capture kinds are a registry: each kind knows how to turn its form
   fields into an item. Text is the only kind today; links, images, files,
   screenshots and voice notes add an entry here (binary payloads go to a
   blob store and the item keeps a reference in meta). */
const Capture = (() => {
  const CATEGORIES = ['Idea', 'Note', 'Reference', 'Personal'];
  const KINDS = {
    text: {
      isEmpty: (f) => !f.text.trim(),
      toItem: (f) => ({ title: f.title.trim(), content: f.text.trim(), meta: { kind: 'text', category: f.category, inbox: true } }),
    },
  };
  let draft = { kind: 'text', title: '', text: '', category: '' }; // kept in memory if the dialog is dismissed
  let current = null;

  function open() {
    if (current) { current.close(); return; }
    const text = h('textarea', { class: 'input', placeholder: 'What’s on your mind?', 'aria-label': 'Capture text', rows: 4, value: draft.text });
    const title = h('input', { class: 'input', type: 'text', placeholder: 'Title (optional)', 'aria-label': 'Title', maxlength: 200, value: draft.title });
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Category' },
      CATEGORIES.map((c) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.category === c), text: c, dataset: { category: c } })));
    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const on = chip.getAttribute('aria-pressed') !== 'true';
      $$('.chip', chips).forEach((c) => c.setAttribute('aria-pressed', 'false'));
      chip.setAttribute('aria-pressed', String(on));
      draft.category = on ? chip.dataset.category : '';
    });
    const read = () => ({ kind: draft.kind, title: title.value, text: text.value, category: draft.category });

    function save(close) {
      const fields = read();
      const kind = KINDS[fields.kind];
      if (kind.isEmpty(fields)) { text.focus(); text.setAttribute('aria-invalid', 'true'); return; }
      Items.create('capture', kind.toItem(fields));
      draft = { kind: 'text', title: '', text: '', category: '' };
      close('saved');
      Toast.show('Captured to Inbox', { action: UI.get().page === 'notes' ? null : { label: 'View', run: () => Navigation.go('notes') } });
    }
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(current.close); }
    });
    text.addEventListener('input', () => text.removeAttribute('aria-invalid'));

    const hint = h('span', { class: 'dialog__hint' }, h('kbd', { text: MOD }), h('kbd', { text: '↵' }), ' to save');
    current = Dialog.open({
      title: 'Quick capture',
      className: 'dialog--wide dialog--top',
      body: h('div', { class: 'form' }, text, title, chips),
      actions: [hint, 'spacer', { label: 'Cancel' }, { label: 'Save to Inbox', variant: 'primary', submit: true }],
      initialFocus: text,
      onSubmit: save,
      onClose: (result) => {
        if (result !== 'saved') { const f = read(); draft.title = f.title; draft.text = f.text; }
        current = null;
      },
    });
  }
  return { open };
})();

/* ---------- Settings ---------- */
const SettingsPanel = (() => {
  const SHORTCUTS = [
    ['Quick capture', [MOD, 'K']],
    ['Save backup', [MOD, 'S']],
    ['New task (Home) · capture (Notes)', ['N']],
    ['Search tasks', ['/']],
    ['Close dialogs and menus', ['Esc']],
    ['Move between days in the calendar', ['←', '→', '↑', '↓']],
  ];
  function seg(options, value, onPick, label) {
    const group = h('div', { class: 'seg', role: 'group', 'aria-label': label },
      options.map(([val, text]) => h('button', { type: 'button', 'aria-pressed': String(val === value), text, dataset: { value: String(val) } })));
    group.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('button', group).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));

  const row = (label, control) => h('div', { class: 'settings__row' }, h('span', { text: label }), control);
  const group = (title, ...rows) => h('section', { class: 'settings__group' }, h('h3', { class: 'eyebrow', text: title }), rows);

  function accentPicker(current) {
    const custom = h('input', { type: 'color', value: current, 'aria-label': 'Custom accent colour' });
    const customWrap = h('label', { class: 'swatch swatch--custom', 'data-tip': 'Custom', 'aria-pressed': String(!ACCENTS.includes(current)) }, custom);
    const wrap = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Accent colour' },

      customWrap);

      $$('.swatch[data-color]', wrap).forEach((s) => s.setAttribute('aria-pressed', String(s.dataset.color === color)));
      customWrap.setAttribute('aria-pressed', String(!ACCENTS.includes(color)));

    custom.addEventListener('input', () => { Settings.set({ accent: custom.value.toLowerCase() }); mark(custom.value.toLowerCase()); });
    mark(current);

  function open() {

    location.addEventListener('input', () => Settings.set({ location: location.value }));

    const body = h('div', { class: 'settings' },
      group('Clock',
        row('Time format', seg([[false, '12-hour'], [true, '24-hour']], s.clock24, (v) => Settings.set({ clock24: v }), 'Time format')),
        row('Location', location)),
      group('Calendar',
        row('Week starts on', seg([[1, 'Monday'], [0, 'Sunday']], s.weekStart, (v) => Settings.set({ weekStart: v }), 'Week starts on'))),
      group('Appearance', row('Accent colour', accentPicker(s.accent))),
      group('Keyboard shortcuts',
        h('dl', { class: 'shortcuts' }, SHORTCUTS.map(([label, keys]) => [h('dt', { text: label }), h('dd', null, keys.map((k) => h('kbd', { text: k })))]))),
      group('Your data',
        h('p', { class: 'note', text: 'Everything stays in this browser on this device. Nothing is sent anywhere. Save a backup to keep a copy or move to another device.' }),
        h('div', { class: 'settings__row' },
          h('button', { class: 'btn', type: 'button', onclick: () => Backup.download() }, icon('save', 'icon--sm'), 'Save backup'),
          h('button', { class: 'btn', type: 'button', onclick: () => $('#file-input').click() }, icon('load', 'icon--sm'), 'Load backup'))));

/* ---------- Navigation ----------
   Hash routes (#/notes) work from a local file and on GitHub Pages, keep
   the back button meaningful, and never reload the page. */
const Navigation = (() => {
  const fromHash = () => { const id = location.hash.replace(/^#\/?/, ''); return PAGE_IDS.includes(id) ? id : null; };
  function go(page) {
    if (!PAGE_IDS.includes(page)) page = 'home';
    if (fromHash() !== page) location.hash = `/${page}`;
    else if (UI.get().page !== page) UI.set({ page });
  }
  function syncHash() {
    const page = UI.get().page;
    if (fromHash() !== page) history.replaceState(null, '', `#/${page}`);
  }
  function init() {
    const initial = fromHash();
    if (initial && initial !== UI.get().page) UI.set({ page: initial });
    else syncHash();
    window.addEventListener('hashchange', () => {
      const page = fromHash();
      if (page && page !== UI.get().page) UI.set({ page });
    });
    $('#nav').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-page]');
      if (btn) go(btn.dataset.page);
    });
  }
  function render() {
    const page = UI.get().page;
    $$('#nav [data-page]').forEach((b) => (b.getAttribute('data-page') === page ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
    $$('main > .page').forEach((p) => { p.hidden = p.dataset.page !== page; });
    $('.app').dataset.page = page;
    document.title = page === 'home' ? 'STILL' : `${PAGES[page].title} · STILL`;
    if (page === 'home') Clock.start(); else Clock.stop();
  }
  return { init, go, render, syncHash };
})();

/* ---------- Event handling: global actions ---------- */
const ACTIONS = {
  save: () => Backup.download(),
  load: () => $('#file-input').click(),
  capture: () => Capture.open(),
  settings: () => SettingsPanel.open(),
  'cal-prev': () => Calendar.shiftMonth(-1),
  'cal-next': () => Calendar.shiftMonth(1),
  'cal-today': () => Calendar.goToday(),
  'event-new': () => EventEditor.open(),
  'event-edit': (el) => EventEditor.open(el.dataset.id),
  'task-new': () => TaskPanel.openComposer(),
  'week-prev': () => TaskPanel.shiftWeek(-1),
  'week-next': () => TaskPanel.shiftWeek(1),
};
function bindActions() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el);
  });
  $('#file-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    Backup.restoreFromFile(file);
  });
  $('#btn-save').dataset.tip = `Save backup  (${MOD} S)`;
  $('#btn-capture').dataset.tip = `Quick capture  (${MOD} K)`;
}

/* ---------- Keyboard shortcuts ---------- */
function bindKeyboard() {
  const isTyping = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  document.addEventListener('keydown', (e) => {
    const mod = IS_MAC ? e.metaKey : e.ctrlKey;
    const key = e.key.toLowerCase();
    if (mod && !e.altKey && !e.shiftKey && key === 'k') { e.preventDefault(); Capture.open(); return; }
    if (mod && !e.altKey && !e.shiftKey && key === 's') { e.preventDefault(); Backup.download(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || isTyping(e.target) || Dialog.anyOpen()) return;
    const page = UI.get().page;
    if (key === 'n') {
      if (page === 'home') { e.preventDefault(); TaskPanel.openComposer(); }
      else if (page === 'notes') { e.preventDefault(); Capture.open(); }
    } else if (e.key === '/' && page === 'home') {
      e.preventDefault(); TaskPanel.focusSearch();
    }
  });
}

/* ---------- Drag-and-drop restore ---------- */
function bindDrop() {
  const zone = $('#dropzone');
  let depth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; zone.hidden = false; });
  window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) zone.hidden = true; });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0; zone.hidden = true;
    const file = e.dataTransfer.files[0];
    if (Dialog.anyOpen()) { Toast.show('Close the open dialog before restoring a backup.', { type: 'error' }); return; }
    Backup.restoreFromFile(file);
  });
}

/* ---------- Rendering ----------
   All store changes funnel into one redraw per animation frame. Only the
   visible page is drawn; a page is drawn fresh whenever it is shown. */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  Theme.apply();
  Navigation.render();
  const page = UI.get().page;
  if (page === 'home') {
    Clock.render();
    Calendar.render();
    TaskPanel.render();
  } else if (page === 'notes') {
    Inbox.render();
  }
}

/* Day rollover: when midnight passes, "today" moves everywhere. */
function watchDay() {
  let day = Dates.today();
  let hour = new Date().getHours();
  setInterval(() => {
    const now = new Date();
    if (Dates.today() !== day || now.getHours() !== hour) {
      day = Dates.today(); hour = now.getHours();
      scheduleRender();
    }
  }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRender(); });
}

/* ---------- Application initialisation ---------- */
function init() {
  const { state, warning } = Persistence.load();
  Store.replace(state, 'init');
  Store.subscribe((_, reason) => {
    Persistence.schedule();
    scheduleRender();
    if (reason === 'restore') Navigation.render();
  });
  Clock.build();
  Calendar.build();
  TaskPanel.build();
  buildPlaceholderPages();
  bindActions();
  bindKeyboard();
  bindDrop();
  Navigation.init();
  watchDay();
  render();
  if (warning) Toast.show(warning, { type: 'error', duration: 7000 });
}

init();
})();
</script>
